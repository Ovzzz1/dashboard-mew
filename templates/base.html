<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mew Korean Learning{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    {% block head %}{% endblock %}
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a href="/" class="sidebar-brand">
            <img src="/static/images/mew.png" alt="Mew" class="sidebar-logo">
            <span class="sidebar-title">Mew</span>
        </a>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-section-label">Navigation</div>
        <a href="/" class="sidebar-link {% block nav_vocab %}{% endblock %}" id="nav-vocab">
            <span class="sidebar-icon"><i data-lucide="book"></i></span>
            <span>Vocabulaire</span>
        </a>
        <a href="/lessons" class="sidebar-link {% block nav_lessons %}{% endblock %}" id="nav-lessons">
            <span class="sidebar-icon"><i data-lucide="pen-tool"></i></span>
            <span>Lessons</span>
        </a>

        {% block sidebar_extra %}{% endblock %}
    </nav>

    <div class="sidebar-footer">
        <div class="sidebar-footer-text">
            <span class="kr">한국어</span> Dashboard
        </div>
    </div>
</aside>

<!-- Mobile overlay -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- Main content -->
<div class="main-wrap" id="main-wrap">
    <!-- Mobile top bar -->
    <div class="topbar" id="topbar">
        <button class="topbar-toggle" onclick="toggleSidebar()">
            <span></span><span></span><span></span>
        </button>
        <a href="/" class="topbar-brand">
            <img src="/static/images/mew.png" alt="Mew" class="topbar-logo">
            <span>Mew</span>
        </a>
    </div>

    <main>
        {% block content %}{% endblock %}
    </main>
</div>

<script>
lucide.createIcons();
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('open');
}
</script>
{% block scripts %}{% endblock %}

</body>
</html>
