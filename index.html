<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mew Korean Learning</title>
    <link rel="stylesheet" href="static/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        #lesson-frame { width:100%; border:none; height:calc(100vh - 120px); border-radius:var(--radius); display:block; }
        .lesson-viewer-bar { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 20px; display:flex; align-items:center; gap:10px; margin-bottom:1rem; }
        .lesson-viewer-bar a { color:var(--accent); text-decoration:none; font-size:0.875rem; font-weight:500; }
        .lesson-viewer-bar a:hover { text-decoration:underline; }
        .lesson-viewer-bar .crumb { color:var(--text-muted); font-size:0.85rem; }
        .loading { display:flex; align-items:center; justify-content:center; min-height:200px; color:var(--text-dim); font-size:0.95rem; gap:10px; }
        /* Level dot */
        .col-level { text-align:center; padding:0 6px !important; vertical-align:middle !important; cursor:pointer; width:36px; }
        .level-dot { display:inline-block; width:14px; height:14px; border-radius:50%; background:transparent; border:2px solid var(--border); transition:all .2s ease; cursor:pointer; }
        .col-level:hover .level-dot { transform:scale(1.4); border-color:var(--text-muted); }
        tr[data-level="green"] .level-dot { background:var(--green); border-color:var(--green); box-shadow:0 0 6px var(--green); }
        tr[data-level="orange"] .level-dot { background:var(--orange); border-color:var(--orange); box-shadow:0 0 6px var(--orange); }
        tr[data-level="red"] .level-dot { background:var(--red); border-color:var(--red); box-shadow:0 0 6px var(--red); }
        /* Add word btn in chapter sep */
        .chapter-sep td { display:flex; align-items:center; justify-content:space-between; }
        .add-word-btn { display:inline-flex; align-items:center; gap:5px; padding:5px 12px; border-radius:var(--radius-xs); border:1px solid var(--accent-dim); background:var(--accent-glow); color:var(--accent); font-size:.78rem; font-weight:600; cursor:pointer; transition:var(--transition); }
        .add-word-btn:hover { background:var(--accent-dim); color:#fff; border-color:var(--accent); }
        /* Level filter bar */
        .level-filter-bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:1rem; padding:12px 14px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); }
        .lvl-filter-btn { padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--bg-card-alt); color:var(--text-dim); font-size:.82rem; font-weight:500; cursor:pointer; transition:var(--transition); }
        .lvl-filter-btn:hover { border-color:var(--accent-dim); color:var(--text); }
        .lvl-filter-btn.active { background:var(--accent-glow); border-color:var(--accent); color:var(--accent); font-weight:600; }
        /* Modal */
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); backdrop-filter:blur(6px); z-index:400; }
        .modal-overlay.open { display:block; }
        .modal { position:fixed; top:50%; left:50%; transform:translate(-50%,-52%) scale(.96); z-index:500; width:min(540px,94vw); background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 24px 60px rgba(0,0,0,.5); padding:1.75rem 2rem; opacity:0; pointer-events:none; transition:opacity .25s ease,transform .25s cubic-bezier(.34,1.56,.64,1); }
        .modal.open { opacity:1; pointer-events:all; transform:translate(-50%,-50%) scale(1); }
        .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:.4rem; }
        .modal-title { font-size:1.15rem; font-weight:700; display:flex; align-items:center; gap:8px; }
        .modal-subtitle { font-size:.82rem; color:var(--accent); font-weight:600; margin-bottom:1.2rem; }
        .modal-close { width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--bg-card-alt); color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:var(--transition); }
        .modal-close:hover { border-color:var(--red); color:var(--red); }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:1.5rem; }
        .form-group { display:flex; flex-direction:column; gap:6px; }
        .form-group-full { grid-column:1/-1; }
        .form-label { font-size:.78rem; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim); }
        .form-label .req { color:var(--red); }
        .form-input { padding:10px 14px; background:var(--bg-card-alt); border:1px solid var(--border); border-radius:var(--radius-xs); color:var(--text); font-size:.9rem; font-family:inherit; outline:none; transition:var(--transition); }
        .form-input::placeholder { color:var(--text-muted); }
        .form-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
        .form-textarea { resize:vertical; min-height:68px; }
        .modal-actions { display:flex; gap:12px; justify-content:flex-end; }
        .btn-primary { display:inline-flex; align-items:center; gap:6px; padding:10px 22px; border-radius:var(--radius-sm); border:none; background:linear-gradient(135deg,var(--accent-dim),var(--accent)); color:#fff; font-size:.9rem; font-weight:600; cursor:pointer; transition:var(--transition); }
        .btn-primary:hover { opacity:.88; }
        .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
        .btn-secondary { padding:10px 18px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-card-alt); color:var(--text-dim); font-size:.9rem; font-weight:500; cursor:pointer; transition:var(--transition); }
        .btn-secondary:hover { border-color:var(--text-dim); color:var(--text); }
        .modal-success { display:flex; align-items:center; gap:10px; padding:14px 18px; border-radius:var(--radius-sm); background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.3); color:var(--green); font-weight:500; margin-top:.5rem; }
        @media(max-width:480px) { .form-grid{grid-template-columns:1fr;} .modal{padding:1.25rem;} }
    </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a href="#" class="sidebar-brand">
            <img src="static/images/mew.png" alt="Mew" class="sidebar-logo">
            <span class="sidebar-title">Mew</span>
        </a>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-section-label">Navigation</div>
        <a href="#" class="sidebar-link" id="nav-vocab">
            <span class="sidebar-icon"><i data-lucide="book"></i></span>
            <span>Vocabulaire</span>
        </a>
        <a href="#lessons" class="sidebar-link" id="nav-lessons">
            <span class="sidebar-icon"><i data-lucide="pen-tool"></i></span>
            <span>Lessons</span>
        </a>
        <div id="sidebar-extra"></div>

    <div class="sidebar-footer">
        <div class="sidebar-footer-text">
            <span class="kr">한국어</span> Dashboard
        </div>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<div class="main-wrap">
    <div class="topbar">
        <button class="topbar-toggle" onclick="toggleSidebar()">
            <span></span><span></span><span></span>
        </button>
        <a href="#" class="topbar-brand">
            <img src="static/images/mew.png" alt="Mew" class="topbar-logo">
            <span>Mew</span>
        </a>
    </div>
    <main id="content"><div class="loading">Chargement…</div></main>
</div>

<!-- Add word modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeAddModal()"></div>
<div class="modal" id="add-word-modal">
    <div class="modal-header">
        <h2 class="modal-title"><i data-lucide="plus-circle" class="icon-sm"></i> Ajouter un mot</h2>
        <button class="modal-close" onclick="closeAddModal()"><i data-lucide="x" class="icon-sm"></i></button>
    </div>
    <p class="modal-subtitle" id="modal-subtitle"></p>
    <form id="add-word-form" onsubmit="submitNewWord(event)">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="fw-hangul">한글 <span class="req">*</span></label>
                <input class="form-input" id="fw-hangul" type="text" placeholder="가다" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="fw-french">Français <span class="req">*</span></label>
                <input class="form-input" id="fw-french" type="text" placeholder="aller" required>
            </div>
            <div class="form-group form-group-full">
                <label class="form-label" for="fw-example">Exemple</label>
                <input class="form-input" id="fw-example" type="text" placeholder="저는 학교에 가요.">
            </div>
            <div class="form-group form-group-full">
                <label class="form-label" for="fw-translated">Traduction</label>
                <input class="form-input" id="fw-translated" type="text" placeholder="Je vais à l'école.">
            </div>
            <div class="form-group form-group-full">
                <label class="form-label" for="fw-explanation">Explication</label>
                <textarea class="form-input form-textarea" id="fw-explanation" placeholder="Notes..."></textarea>
            </div>
        </div>
        <div class="modal-actions">
            <button type="button" class="btn-secondary" onclick="closeAddModal()">Annuler</button>
            <button type="submit" class="btn-primary" id="btn-submit-word"><i data-lucide="save" class="icon-xs"></i> Enregistrer</button>
        </div>
    </form>
    <div class="modal-success" id="modal-success" style="display:none">
        <span>✅ Mot ajouté avec succès !</span>
    </div>
</div>

<script>
// ================================================================
// DATA (inlined from manifest.json — auto-updated by LLM)
// ================================================================
let MANIFEST = null;
const bookCache = {};

// ================================================================
// CSV PARSER
// ================================================================
function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQ) {
            if (ch === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQ = false; }
            else field += ch;
        } else {
            if (ch === '"') inQ = true;
            else if (ch === ',') { row.push(field); field = ''; }
            else if (ch === '\n' || ch === '\r') {
                if (ch === '\r' && text[i+1] === '\n') i++;
                row.push(field); field = '';
                if (row.some(f => f)) rows.push(row);
                row = [];
            } else field += ch;
        }
    }
    if (field || row.length) { row.push(field); if (row.some(f => f)) rows.push(row); }
    return rows;
}

function parseVocabCSV(text, bookId) {
    const rows = parseCSV(text);
    const chapters = {};
    let cur = 0;
    let total = 0;
    for (let i = 1; i < rows.length; i++) {
        const [h='', fr='', ex='', tr='', expl=''] = rows[i].map(s => s.trim());
        if (h && /^\d+과$/.test(h) && !fr) {
            cur = parseInt(h);
            if (!chapters[cur]) chapters[cur] = [];
            continue;
        }
        if (!h && !fr) continue;
        if (!chapters[cur]) chapters[cur] = [];
        chapters[cur].push({ hangul: h, french: fr, example: ex, translated: tr, explanation: expl });
        total++;
    }
    return { id: bookId, name: `Vocab ${bookId}`, chapters, total };
}

async function fetchBook(bookId) {
    if (bookCache[bookId]) return bookCache[bookId];
    const res = await fetch(`content/vocab/Vocab ${bookId}.csv`);
    const text = await res.text();
    bookCache[bookId] = parseVocabCSV(text, bookId);
    return bookCache[bookId];
}

// ================================================================
// ROUTING
// ================================================================
function getRoute() {
    const h = decodeURIComponent(location.hash || '#');
    const parts = h.slice(1).split('/').filter(Boolean);
    return { page: parts[0] || '', args: parts.slice(1) };
}

window.addEventListener('hashchange', route);
window.addEventListener('load', async () => {
    const res = await fetch('content/manifest.json');
    MANIFEST = await res.json();
    route();
});

async function route() {
    const { page, args } = getRoute();
    setNavActive(page);
    const el = document.getElementById('content');
    el.innerHTML = '<div class="loading">Chargement…</div>';
    lucide.createIcons();

    if (!page || page === '') { await renderHome(); }
    else if (page === 'vocab') { await renderVocab(args[0], args[1] ? parseInt(args[1]) : null); }
    else if (page === 'lessons') { renderLessons(); }
    else if (page === 'lesson') { renderLesson(args[0], args.slice(1).join('/')); }
}

function setNavActive(page) {
    document.getElementById('nav-vocab').classList.toggle('active', !page || page === '' || page === 'vocab');
    document.getElementById('nav-lessons').classList.toggle('active', page === 'lessons' || page === 'lesson');
}

// ================================================================
// HOME — books grid
// ================================================================
async function renderHome() {
    const books = [];
    for (const id of MANIFEST.books) {
        const b = await fetchBook(id);
        books.push(b);
    }

    // Sidebar extra: book links
    document.getElementById('sidebar-extra').innerHTML = `
        <div class="nav-section-label">Livres</div>
        ${books.map(b => `
        <a href="#vocab/${b.id}" class="sidebar-link">
            <span class="sidebar-icon"><i data-lucide="book-open" class="icon-sm"></i></span>
            <span>${b.name}</span>
        </a>`).join('')}
    `;

    const totalWords = books.reduce((s, b) => s + b.total, 0);

    document.getElementById('content').innerHTML = `
        <div class="hero">
            <h1><span class="kr">한국어</span> Vocabulary</h1>
            <p class="subtitle">${books.length} livres &bull; ${totalWords} mots au total</p>
        </div>
        <div class="books-grid">
            ${books.map(b => {
                const lvl = b.id.startsWith('3') ? 'l3' : 'l4';
                const chCount = Object.keys(b.chapters).length;
                return `<a href="#vocab/${b.id}" class="book-card">
                    <span class="book-level ${lvl}">Level ${b.id}</span>
                    <div class="book-title">${b.name}</div>
                    <div class="book-stats">
                        <div class="book-stat">
                            <span class="book-stat-value">${b.total}</span>
                            <span class="book-stat-label">Mots</span>
                        </div>
                        <div class="book-stat">
                            <span class="book-stat-value">${chCount}</span>
                            <span class="book-stat-label">Chapitres</span>
                        </div>
                    </div>
                </a>`;
            }).join('')}
        </div>
    `;
    lucide.createIcons();
}

// ================================================================
// VOCAB — table with chapters, search, toggle
// ================================================================
async function renderVocab(bookId, selectedChapter) {
    if (!bookId) { location.hash = '#'; return; }
    const book = await fetchBook(bookId);
    const books = [];
    for (const id of MANIFEST.books) books.push(await fetchBook(id));

    const chNums = Object.keys(book.chapters).map(Number).sort((a,b)=>a-b);
    const avgPerCh = chNums.length ? Math.round(book.total / chNums.length) : 0;

    // Sidebar
    document.getElementById('sidebar-extra').innerHTML = `
        <div class="nav-section-label">Livres</div>
        ${books.map(b => `
        <a href="#vocab/${b.id}" class="sidebar-link ${b.id === bookId ? 'active' : ''}">
            <span class="sidebar-icon"><i data-lucide="book-open" class="icon-sm"></i></span>
            <span>${b.name}</span>
        </a>`).join('')}
        <div class="nav-section-label">Chapitres</div>
        <div class="sidebar-sub">
            <a href="#vocab/${bookId}" class="sidebar-link ${selectedChapter === null ? 'active' : ''}">
                <span>Tous (${book.total})</span>
            </a>
            ${chNums.map(n => `
            <a href="#vocab/${bookId}/${n}" class="sidebar-link ${selectedChapter === n ? 'active' : ''}">
                <span>${n}과 (${book.chapters[n].length})</span>
            </a>`).join('')}
        </div>
    `;

    // Build table rows (with level dot + custom words from localStorage)
    let counter = 0;
    const customWords = getCustomWords(bookId);
    const rowsHTML = chNums.filter(n => selectedChapter === null || selectedChapter === n).map(n => {
        const allWords = [...book.chapters[n], ...(customWords[n] || [])];
        const sepRow = `<tr class="chapter-sep" data-chapter="${n}">
            <td colspan="7"><span><i data-lucide="book" class="icon-xs"></i> Chapitre ${n}과 — ${allWords.length} mots</span>
            <button class="add-word-btn" onclick="openAddModal('${bookId}',${n},event)"><i data-lucide="plus" class="icon-xs"></i> Ajouter</button></td>
        </tr>`;
        const wordRows = allWords.map(e => {
            counter++;
            const key = `${n}_${e.hangul}`;
            return `<tr class="vocab-row" data-hangul="${e.hangul.toLowerCase()}" data-french="${e.french.toLowerCase()}" data-level="none" data-lkey="${key}" onclick="this.classList.toggle('expanded')">
                <td class="col-level" onclick="cycleLvl(this.parentElement,event)"><span class="level-dot"></span></td>
                <td style="color:var(--text-muted);font-size:0.8rem">${counter}</td>
                <td class="col-hangul">${e.hangul}</td>
                <td class="col-french">${e.french}</td>
                <td class="col-example example-col">${e.example}</td>
                <td class="col-translated example-col">${e.translated}</td>
                <td class="col-explanation detail-col" style="display:none">${e.explanation}</td>
            </tr>`;
        }).join('');
        return sepRow + wordRows;
    }).join('');

    document.getElementById('content').innerHTML = `
        <div class="vocab-header">
            <div class="vocab-title-group">
                <p class="breadcrumb"><a href="#"><i data-lucide="home" class="icon-xs"></i> Home</a> → ${book.name}</p>
                <h1>${book.name}</h1>
            </div>
        </div>
        <div class="stats-bar">
            <div class="stat-card"><div class="stat-value purple">${counter}</div><div class="stat-label">Total mots</div></div>
            <div class="stat-card"><div class="stat-value pink">${chNums.length}</div><div class="stat-label">Chapitres</div></div>
            <div class="stat-card"><div class="stat-value cyan">${chNums.length ? Math.round(counter / chNums.length) : 0}</div><div class="stat-label">Mots / chapitre</div></div>
            <div class="stat-card"><div class="stat-value green" id="count-green">0</div><div class="stat-label">Maîtrisés 🟢</div></div>
            <div class="stat-card"><div class="stat-value" style="color:var(--orange)" id="count-orange">0</div><div class="stat-label">En cours 🟠</div></div>
            <div class="stat-card"><div class="stat-value" style="color:var(--red)" id="count-red">0</div><div class="stat-label">À apprendre 🔴</div></div>
        </div>
        <div class="chapter-nav">
            <a href="#vocab/${bookId}" class="ch-pill ${selectedChapter === null ? 'active' : ''}">
                Tous <span class="count">${counter}</span>
            </a>
            ${chNums.map(n => `
            <a href="#vocab/${bookId}/${n}" class="ch-pill ${selectedChapter === n ? 'active' : ''}">
                ${n}과 <span class="count">${(book.chapters[n].length + (customWords[n]||[]).length)}</span>
            </a>`).join('')}
        </div>
        <div class="controls">
            <div class="search-box">
                <span class="icon"><i data-lucide="search" class="icon-xs"></i></span>
                <input type="text" id="search" placeholder="Rechercher en 한글 ou français…" oninput="filterVocab()">
            </div>
            <button class="toggle-btn" id="toggle-details" onclick="toggleDetails()">
                <i data-lucide="file-text" class="icon-xs"></i> Détails
            </button>
            <button class="toggle-btn" id="toggle-examples" onclick="toggleExamples()">
                <i data-lucide="message-square" class="icon-xs"></i> Exemples
            </button>
            <button class="toggle-btn" id="toggle-lvl-filter" onclick="toggleLvlFilter()">
                <i data-lucide="filter" class="icon-xs"></i> Filtrer niveau
            </button>
        </div>
        <div class="level-filter-bar" id="lvl-filter-bar" style="display:none">
            <button class="lvl-filter-btn active" data-lvl="all" onclick="setLvlFilter('all')">Tous</button>
            <button class="lvl-filter-btn" data-lvl="green" onclick="setLvlFilter('green')">🟢 Maîtrisés</button>
            <button class="lvl-filter-btn" data-lvl="orange" onclick="setLvlFilter('orange')">🟠 En cours</button>
            <button class="lvl-filter-btn" data-lvl="red" onclick="setLvlFilter('red')">🔴 À apprendre</button>
            <button class="lvl-filter-btn" data-lvl="none" onclick="setLvlFilter('none')">⚫ Non évalués</button>
        </div>
        <div class="word-counter" id="word-counter">
            <strong id="visible-count">${counter}</strong> mots affichés
        </div>
        <div class="vocab-table-wrap">
            <table class="vocab-table" id="vocab-table">
                <thead>
                    <tr>
                        <th style="width:36px" title="Niveau">Niv.</th>
                        <th style="width:30px">#</th>
                        <th>한글</th>
                        <th>Français</th>
                        <th class="example-col">Exemple</th>
                        <th class="example-col">Traduction</th>
                        <th class="detail-col" style="display:none">Explication</th>
                    </tr>
                </thead>
                <tbody>${rowsHTML}</tbody>
            </table>
        </div>
    `;
    lucide.createIcons();
    // Apply saved levels
    applyLevelsFromStorage(bookId);
}

// ================================================================
// LEVEL SYSTEM (localStorage)
// ================================================================
const LVL_CYCLE = ['none','green','orange','red'];
let _currentLvlFilter = 'all';
let _lvlFilterActive = false;

function getLvlStore(bookId) { try { return JSON.parse(localStorage.getItem(`mew_lvl_${bookId}`) || '{}'); } catch { return {}; } }
function saveLvlStore(bookId, data) { localStorage.setItem(`mew_lvl_${bookId}`, JSON.stringify(data)); }

function applyLevelsFromStorage(bookId) {
    const data = getLvlStore(bookId);
    document.querySelectorAll('.vocab-row').forEach(tr => {
        const key = tr.dataset.lkey;
        const lvl = data[key] || 'none';
        tr.dataset.level = lvl;
    });
    updateLvlStats();
}

function cycleLvl(tr, e) {
    e.stopPropagation();
    const cur = tr.dataset.level || 'none';
    const next = LVL_CYCLE[(LVL_CYCLE.indexOf(cur) + 1) % LVL_CYCLE.length];
    tr.dataset.level = next;
    // Save
    const bookId = getRoute().args[0];
    const data = getLvlStore(bookId);
    data[tr.dataset.lkey] = next;
    saveLvlStore(bookId, data);
    updateLvlStats();
    filterVocab();
}

function updateLvlStats() {
    let g=0, o=0, r=0;
    document.querySelectorAll('.vocab-row').forEach(tr => {
        const l = tr.dataset.level;
        if (l==='green') g++; else if (l==='orange') o++; else if (l==='red') r++;
    });
    const eg = document.getElementById('count-green');
    const eo = document.getElementById('count-orange');
    const er = document.getElementById('count-red');
    if (eg) eg.textContent = g;
    if (eo) eo.textContent = o;
    if (er) er.textContent = r;
}

function toggleLvlFilter() {
    _lvlFilterActive = !_lvlFilterActive;
    document.getElementById('lvl-filter-bar').style.display = _lvlFilterActive ? 'flex' : 'none';
    document.getElementById('toggle-lvl-filter').classList.toggle('active', _lvlFilterActive);
}

function setLvlFilter(lvl) {
    _currentLvlFilter = lvl;
    document.querySelectorAll('.lvl-filter-btn').forEach(b => b.classList.toggle('active', b.dataset.lvl === lvl));
    filterVocab();
}

// ================================================================
// CUSTOM WORDS (localStorage — for GitHub Pages static hosting)
// ================================================================
function getCustomWords(bookId) { try { return JSON.parse(localStorage.getItem(`mew_custom_${bookId}`) || '{}'); } catch { return {}; } }
function saveCustomWords(bookId, data) { localStorage.setItem(`mew_custom_${bookId}`, JSON.stringify(data)); }

let _addModalBookId = null, _addModalChapter = null;

function openAddModal(bookId, chapter, e) {
    e.stopPropagation();
    _addModalBookId = bookId;
    _addModalChapter = chapter;
    document.getElementById('modal-subtitle').textContent = `Chapitre ${chapter}과 — Vocab ${bookId}`;
    document.getElementById('add-word-form').reset();
    document.getElementById('modal-success').style.display = 'none';
    document.getElementById('add-word-form').style.display = '';
    document.getElementById('btn-submit-word').disabled = false;
    document.getElementById('modal-overlay').classList.add('open');
    document.getElementById('add-word-modal').classList.add('open');
    lucide.createIcons();
    setTimeout(() => document.getElementById('fw-hangul').focus(), 120);
}

function closeAddModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('add-word-modal').classList.remove('open');
}

function submitNewWord(e) {
    e.preventDefault();
    const word = {
        hangul: document.getElementById('fw-hangul').value.trim(),
        french: document.getElementById('fw-french').value.trim(),
        example: document.getElementById('fw-example').value.trim(),
        translated: document.getElementById('fw-translated').value.trim(),
        explanation: document.getElementById('fw-explanation').value.trim(),
    };
    if (!word.hangul || !word.french) return;
    const cw = getCustomWords(_addModalBookId);
    if (!cw[_addModalChapter]) cw[_addModalChapter] = [];
    cw[_addModalChapter].push(word);
    saveCustomWords(_addModalBookId, cw);
    // Also invalidate book cache so re-render picks it up
    delete bookCache[_addModalBookId];
    document.getElementById('add-word-form').style.display = 'none';
    document.getElementById('modal-success').style.display = 'flex';
    setTimeout(() => { closeAddModal(); route(); }, 900);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAddModal(); });

// ================================================================
// VOCAB FILTERS & TOGGLES
// ================================================================
let _detailsVisible = false;
let _examplesVisible = true;

function filterVocab() {
    const q = (document.getElementById('search')?.value || '').toLowerCase().trim();
    const rows = document.querySelectorAll('.vocab-row');
    let visible = 0;
    rows.forEach(row => {
        const matchQ  = !q || row.dataset.hangul.includes(q) || row.dataset.french.includes(q);
        const matchLv = _currentLvlFilter === 'all' || (row.dataset.level || 'none') === _currentLvlFilter;
        const show = matchQ && matchLv;
        row.style.display = show ? '' : 'none';
        if (show) visible++;
    });
    document.querySelectorAll('.chapter-sep').forEach(sep => {
        let next = sep.nextElementSibling;
        let hasVisible = false;
        while (next && !next.classList.contains('chapter-sep')) {
            if (next.style.display !== 'none') hasVisible = true;
            next = next.nextElementSibling;
        }
        sep.style.display = hasVisible ? '' : 'none';
    });
    const vc = document.getElementById('visible-count');
    if (vc) vc.textContent = visible;
}

function toggleDetails() {
    _detailsVisible = !_detailsVisible;
    document.querySelectorAll('.detail-col').forEach(el => el.style.display = _detailsVisible ? '' : 'none');
    document.getElementById('toggle-details').classList.toggle('active', _detailsVisible);
}

function toggleExamples() {
    _examplesVisible = !_examplesVisible;
    document.querySelectorAll('.example-col').forEach(el => el.style.display = _examplesVisible ? '' : 'none');
    document.getElementById('toggle-examples').classList.toggle('active', !_examplesVisible);
}

// ================================================================
// LESSONS — list by level
// ================================================================
function renderLessons() {
    document.getElementById('sidebar-extra').innerHTML = `
        <div class="nav-section-label">Niveaux</div>
        ${Object.keys(MANIFEST.lessons).map(lvl => `
        <a href="#lessons" class="sidebar-link" onclick="document.getElementById('level-${lvl}').scrollIntoView({behavior:'smooth'});return false;">
            <span class="sidebar-icon"><i data-lucide="folder" class="icon-sm"></i></span>
            <span>Level ${lvl}</span>
        </a>`).join('')}
    `;

    const levelsHTML = Object.entries(MANIFEST.lessons).map(([lvl, lessons]) => {
        const cls = lvl.startsWith('3') ? 'l3' : 'l4';
        const cardsHTML = lessons.length ? lessons.map((l, i) => {
            const topicsHTML = l.topics.length ? `
                <div class="lesson-card-topics">
                    ${l.topics.map(t => {
                        const dot = t.indexOf('. ');
                        const num = dot > -1 ? t.slice(0, dot) : '';
                        const text = dot > -1 ? t.slice(dot + 2) : t;
                        return `<span class="topic-tag">
                            <span class="topic-num">${num}.</span>
                            <span class="topic-text">${text}</span>
                        </span>`;
                    }).join('')}
                </div>` : '';
            const name = l.filename.replace('.html', '');
            const encFile = encodeURIComponent(l.filename);
            return `<a href="#lesson/${lvl}/${encFile}" class="lesson-card">
                <div class="lesson-card-inner">
                    <div class="lesson-card-accent"></div>
                    <div class="lesson-card-content">
                        <div class="lesson-card-header">
                            <div class="lesson-card-number">${i + 1}</div>
                            <div class="lesson-card-title">${name}</div>
                        </div>
                        ${topicsHTML}
                    </div>
                    <div class="lesson-card-arrow">→</div>
                </div>
            </a>`;
        }).join('') : '<div class="empty-state">Aucune lesson pour ce niveau pour l\'instant.</div>';

        return `<div class="level-group" id="level-${lvl}">
            <div class="level-group-header">
                <div class="level-group-icon ${cls}"><i data-lucide="folder"></i></div>
                <span class="level-group-title">Level ${lvl}</span>
                <span class="level-group-badge ${cls}">${lessons.length} lessons</span>
            </div>
            <div class="lessons-grid">${cardsHTML}</div>
        </div>`;
    }).join('');

    document.getElementById('content').innerHTML = `
        <div class="hero">
            <h1><span class="kr">한국어</span> Lessons</h1>
            <p class="subtitle">Cours de grammaire et exercices</p>
        </div>
        ${levelsHTML}
    `;
    lucide.createIcons();
}

// ================================================================
// LESSON VIEWER — iframe
// ================================================================
function renderLesson(level, filename) {
    const decodedFile = decodeURIComponent(filename);
    const name = decodedFile.replace('.html', '');
    const src = `content/lessons/${level}/${decodedFile}`;

    document.getElementById('sidebar-extra').innerHTML = `
        <div class="nav-section-label">Niveaux</div>
        ${Object.keys(MANIFEST.lessons).map(lvl => `
        <a href="#lessons" class="sidebar-link ${lvl === level ? 'active' : ''}">
            <span class="sidebar-icon"><i data-lucide="folder" class="icon-sm"></i></span>
            <span>Level ${lvl}</span>
        </a>`).join('')}
    `;

    document.getElementById('content').innerHTML = `
        <div class="lesson-viewer-bar">
            <a href="#lessons">← Retour aux lessons</a>
            <span class="crumb">/ Level ${level} / ${name}</span>
        </div>
        <iframe id="lesson-frame" src="${src}" title="${name}"></iframe>
    `;
    lucide.createIcons();
}

// UTILS
// ================================================================
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('open');
}
