<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mew Korean Learning</title>
    <link rel="icon" type="image/png" href="static/mew.png">
    <link rel="apple-touch-icon" href="static/mew.png">
    <!-- ?v= = empreinte du contenu de style.css : à rebumper à chaque modif
         de la feuille, sinon les navigateurs gardent l'ancienne en cache. -->
    <link rel="stylesheet" href="static/style.css?v=6fe18775">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* ================================================================
           Mew — vues applicatives · charte « Hanji »
           (base + composants partagés : static/style.css)
           ================================================================ */

        /* ================================================================
           A. LEÇON — visionneuse + panneau exo
           ================================================================ */
        .lesson-viewer-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            padding: 0 0 12px;
            margin-bottom: 22px;
            border-bottom: 1px solid var(--line);
            max-width: 1350px;
        }
        .lesson-viewer-bar > a:first-child {
            font: 400 12px var(--f-ui);
            color: var(--ink);
            text-decoration: none;
            border-bottom: 1px solid var(--ink);
            padding-bottom: 1px;
        }
        .lesson-viewer-bar > a:first-child:hover { color: var(--ink-soft); border-color: var(--ink-soft); }
        .lesson-viewer-bar .crumb {
            font: 400 10px var(--f-mono);
            letter-spacing: .1em;
            text-transform: none;
            color: var(--ink-faint);
        }

        #lesson-frame {
            width: 100%;
            max-width: 1350px;
            border: 1px solid var(--line);
            height: 1200px;
            display: block;
            background: var(--paper);
        }

        /* Vue leçon : pleine largeur + scroll de page */
        body.lesson-mode main { max-width: 100%; padding: 34px 42px 60px; }

        .lesson-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 440px;
            gap: 26px;
            align-items: start;
            max-width: 1800px;
        }
        .lesson-layout.no-exos { grid-template-columns: minmax(0, 1350px); }
        .lesson-layout #lesson-frame { max-width: 100%; }

        .exo-side {
            position: sticky;
            top: 16px;
            max-height: calc(100vh - 32px);
            display: flex;
            flex-direction: column;
            background: var(--paper);
            border: 1px solid var(--line);
            overflow: hidden;
        }
        .exo-side-head {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 11px 16px;
            background: var(--ink-surface);
            color: var(--on-ink);
            font: 500 14px var(--f-kr);
            border-bottom: none;
        }
        .exo-side-head .icon-sm,
        .exo-side-head .icon-xs { color: var(--on-ink-mute); }

        /* liste de liens vers les exos (panneau leçon) */
        .exo-links { display: flex; flex-direction: column; overflow-y: auto; }

        /* ================================================================
           B. EXERCICES — cartes, onglets, rendu markdown
           ================================================================ */
        .exo-gwa-block { margin-bottom: 26px; }
        .exo-gwa-head {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--ink-surface);
            color: var(--on-ink);
            padding: 11px 16px;
        }
        .exo-gwa-title {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font: 500 14px var(--f-kr);
        }
        .exo-gwa-title .icon-sm { color: var(--on-ink-mute); }
        .exo-gwa-lesson {
            margin-left: auto;
            font: 400 11px var(--f-ui);
            color: var(--pastel-red);
            text-decoration: none;
        }
        .exo-gwa-lesson:hover { color: var(--paper); }

        .exo-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
            gap: 0;
            border: 1px solid var(--line);
            border-top: none;
        }

        .exo-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            border-right: 1px solid var(--line-soft);
            border-bottom: 1px solid var(--line-soft);
            text-decoration: none;
            color: var(--ink);
            transition: var(--transition);
        }
        .exo-card:hover { background: var(--paper-alt); }

        .exo-card-num {
            width: 22px; height: 22px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border: 1.5px solid var(--status-none);
            color: var(--ink-faint);
            font: 500 11px var(--f-ui);
        }
        .exo-card:hover .exo-card-num { border-color: var(--ink); color: var(--ink); }
        .exo-card-title { flex: 1; font: 400 13px var(--f-ui); color: var(--ink-soft); }
        .exo-card-arrow { color: var(--ink-faint); font-size: 13px; transition: var(--transition); }
        .exo-card:hover .exo-card-arrow { color: var(--ink); transform: translateX(3px); }

        /* liste verticale dans le panneau latéral */
        .exo-links .exo-card { border-right: none; }

        /* --- onglets Exo 1..N --- */
        .exo-standalone { max-width: 1000px; }

        .exo-tabs {
            display: flex;
            gap: 0;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--line);
            margin-bottom: 26px;
            overflow-x: auto;
        }
        .exo-side .exo-tabs { margin-bottom: 0; padding: 0 8px; }

        .exo-tab {
            padding: 10px 15px;
            border: none;
            border-bottom: 1.5px solid transparent;
            background: transparent;
            color: var(--ink-mute);
            font: 400 12px var(--f-ui);
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }
        .exo-tab:hover { color: var(--ink); }
        .exo-tab.active {
            color: var(--ink);
            font-weight: 500;
            border-bottom-color: var(--ink);
        }

        .exo-content { min-height: 200px; }
        .exo-side .exo-content { overflow-y: auto; padding: 16px 18px 22px; }

        /* --- rendu du markdown d'exercice --- */
        .exo-render { font: 400 13.5px/1.75 var(--f-ui); color: var(--ink-soft); }

        /* en-tête de section : « I. Structure 1 : … » */
        .exo-render .exo-h {
            border-top: 1.5px solid var(--ink);
            padding-top: 18px;
            margin: 30px 0 14px;
            font: 500 20px/1.35 var(--f-kr);
            color: var(--ink);
            font-weight: 500;
        }
        .exo-render .exo-h:first-child { margin-top: 0; }

        /* thème de l'exo (ligne **Thème : …** en tête) */
        .exo-render > .exo-h:first-of-type { font-size: 22px; }

        .exo-render ol,
        .exo-render ul { margin: 0 0 18px; padding-left: 0; list-style: none; counter-reset: exoitem; }

        .exo-render ol li {
            counter-increment: exoitem;
            position: relative;
            padding: 9px 0 9px 34px;
            border-bottom: 1px solid var(--line-soft);
            font: 400 14px/1.6 var(--f-ed);
            color: var(--ink);
        }
        .exo-render ol li::before {
            content: counter(exoitem, decimal-leading-zero);
            position: absolute;
            left: 0; top: 12px;
            font: 400 11px var(--f-mono);
            color: var(--ink-faint);
        }
        .exo-render ol li:last-child { border-bottom: none; }

        .exo-render p { margin: 0 0 12px; }

        /* note de grammaire — italique éditoriale */
        .exo-render .exo-note {
            font: 300 13px/1.7 var(--f-ed);
            font-style: italic;
            color: var(--ink-mute);
            padding: 10px 0 10px 16px;
            border-left: 2px solid var(--pastel-blue);
            margin: 0 0 18px;
        }

        /* bloc de corrections repliable */
        .exo-render .exo-corr {
            border: 1px solid var(--line);
            margin: 0 0 22px;
        }
        .exo-render .exo-corr > summary {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 11px 16px;
            background: var(--paper-alt);
            color: var(--ink);
            font: 400 10.5px var(--f-ui);
            letter-spacing: .16em;
            text-transform: uppercase;
            cursor: pointer;
            list-style: none;
            user-select: none;
        }
        .exo-render .exo-corr > summary::-webkit-details-marker { display: none; }
        .exo-render .exo-corr > summary:hover { background: var(--tint-blue); color: var(--accent-blue); }
        .exo-render .exo-corr[open] > summary {
            background: var(--ink-surface);
            color: var(--on-ink);
            border-bottom: 1px solid var(--line);
        }
        .exo-render .exo-corr[open] > summary .icon-xs { color: var(--pastel-red); }

        .exo-corr-body { padding: 14px 18px 18px; }
        .exo-corr-body ol li {
            font: 400 15px/1.7 var(--f-kr);
            color: var(--status-known);
            border-bottom: 1px solid var(--line-soft);
        }
        .exo-corr-body ol li::before { color: var(--ink-faint); top: 13px; }
        .exo-corr-body .exo-note { border-left-color: var(--pastel-red); }

        .no-exos { color: var(--ink-mute); font-style: italic; }

        /* ================================================================
           C. INFOBULLE DE VOCABULAIRE (balisage [[fr|한글]])
           ================================================================ */
        .vocab-hint {
            border-bottom: 1px dashed var(--pastel-red);
            cursor: help;
            position: relative;
            font-weight: 500;
            color: var(--ink);
        }
        .vocab-tip {
            position: absolute;
            bottom: 135%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ink-surface);
            color: var(--on-ink);
            padding: 5px 11px;
            font: 400 13px var(--f-kr);
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity .12s ease;
            z-index: 30;
        }
        .vocab-tip::after {
            content: '';
            position: absolute;
            top: 100%; left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: var(--ink-surface);
        }
        .vocab-hint:hover .vocab-tip,
        .vocab-hint:focus .vocab-tip { opacity: 1; }

        /* ================================================================
           D. FLASHCARDS — carte encre plein cadre
           ================================================================ */
        .fc-wrap { max-width: 980px; }

        .fc-hero { margin-bottom: 20px; }
        .fc-hero h1 { font: 300 34px/1.1 var(--f-ed); color: var(--ink); }
        .fc-hero p { margin-top: 8px; font: 400 12.5px var(--f-ui); color: var(--ink-mute); }

        .fc-mode-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
        .fc-mode-btn {
            padding: 7px 13px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink-soft);
            font: 400 11.5px var(--f-ui);
            cursor: pointer;
            transition: var(--transition);
        }
        .fc-mode-btn:hover { border-color: var(--ink); color: var(--ink); }
        .fc-mode-btn.active {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--paper);
            font-weight: 500;
        }

        .fc-progress-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
        }
        .fc-counter { font: 400 10px var(--f-mono); color: var(--ink-mute); white-space: nowrap; }
        .fc-progress-bar { flex: 1; height: 4px; background: var(--line); }
        .fc-progress-fill { height: 100%; background: var(--ink); transition: width .25s ease; }

        .fc-score-row { display: flex; gap: 14px; margin-bottom: 18px; }
        .fc-score-ok { font: 400 10px var(--f-mono); color: var(--status-known); }
        .fc-score-ko { font: 400 10px var(--f-mono); color: var(--status-todo); }

        /* scène : carte à gauche, colonne de notation à droite (maquette) */
        .fc-stage {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 280px;
            gap: 20px;
            align-items: stretch;
            margin-bottom: 16px;
        }

        /* colonne de notation 1 / 2 / 3 */
        .fc-rates { display: flex; flex-direction: column; gap: 10px; }
        .fc-rate {
            flex: 1;
            border: 1px solid var(--line);
            background: transparent;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            text-align: left;
            cursor: pointer;
            font-family: var(--f-ui);
            transition: var(--transition);
        }
        .fc-rate-label {
            font: 400 10px var(--f-ui);
            letter-spacing: .18em;
            text-transform: uppercase;
        }
        .fc-rate-sub { font: 400 12.5px/1.6 var(--f-ui); color: var(--ink-mute); }

        .fc-rate-red .fc-rate-label    { color: var(--status-todo); }
        .fc-rate-orange .fc-rate-label { color: var(--status-learning); }
        .fc-rate-green .fc-rate-label  { color: var(--status-known); }

        .fc-rate:hover { border-color: var(--ink); }
        /* la note « acquis » est la carte pleine encre de la maquette */
        .fc-rate-green { background: var(--ink-surface); border-color: var(--ink-surface); }
        .fc-rate-green .fc-rate-label { color: #7fbf8f; }
        .fc-rate-green .fc-rate-sub { color: var(--on-ink-soft); }
        .fc-rate-green:hover { background: var(--ink-soft); border-color: var(--ink-soft); }

        /* note déjà attribuée au mot courant */
        .fc-rate.active { box-shadow: inset 0 0 0 1.5px currentColor; }
        .fc-rate-red.active    { border-color: var(--status-todo); }
        .fc-rate-orange.active { border-color: var(--status-learning); }
        .fc-rate-green.active  { box-shadow: inset 0 0 0 1.5px #7fbf8f; }

        .fc-rate-nav { display: flex; gap: 6px; }
        .fc-rate-nav .fc-btn { flex: 1; justify-content: center; text-align: center; }
        .fc-rate-nav .fc-btn.primary { margin-left: 0; }

        /* barre de segments : une case par carte de la session */
        .fc-segments { display: flex; gap: 5px; margin-bottom: 22px; }
        .fc-seg { flex: 1; height: 4px; background: var(--line); }
        .fc-seg-green  { background: var(--status-known); }
        .fc-seg-orange { background: var(--status-learning); }
        .fc-seg-red    { background: var(--status-todo); }
        .fc-seg-now    { background: var(--ink); }

        /* carte 3D */
        .card-perspective {
            perspective: 1600px;
            cursor: pointer;
            min-height: 380px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            min-height: 380px;
            transform-style: preserve-3d;
            transition: transform .5s cubic-bezier(.4, 0, .2, 1);
        }
        .card-inner.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: var(--ink-surface);
            color: var(--on-ink);
            padding: 36px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* filigrane 한글 décoratif */
        .card-face::after {
            content: '한';
            position: absolute;
            right: -40px; bottom: -70px;
            font: 300 260px/1 var(--f-kr);
            color: var(--ink-ghost);
            pointer-events: none;
            user-select: none;
        }
        .card-back { transform: rotateY(180deg); }
        .card-back::after { content: '글'; }

        /* bandeau haut de carte : position dans le paquet + langue affichée */
        .card-meta {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font: 400 10px var(--f-ui);
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--on-ink-mute);
        }
        .card-lang-badge { color: var(--pastel-red); }

        /* 84px est la taille de la maquette pour un mot court type 오해.
           Les gloses françaises étant bien plus longues, la taille descend
           par paliers selon la longueur réelle (classe posée par fcRenderCard),
           sinon le mot déborde et chasse la phrase d'exemple hors de la carte. */
        .card-word {
            position: relative;
            font: 500 84px/1.1 var(--f-kr);
            color: var(--on-ink);
            margin: auto 0 0;
            word-break: break-word;
            hyphens: auto;
        }
        .card-word.len-s  { font-size: 64px; }
        .card-word.len-m  { font-size: 48px; }
        .card-word.len-l  { font-size: 36px; line-height: 1.2; }
        .card-word.len-xl { font-size: 28px; line-height: 1.25; }
        .card-front .card-word,
        .card-back .card-word { margin-top: auto; }

        .card-sub {
            position: relative;
            margin: 18px 0 auto;
            padding-top: 18px;
            border-top: 1px solid var(--ink-line);
        }
        .card-ex { font: 400 17px/1.7 var(--f-kr); color: #e6e8e9; }
        .card-expl { font: 300 14px/1.6 var(--f-ed); font-style: italic; color: var(--on-ink-mute); margin-top: 9px; }

        .card-hint {
            position: relative;
            margin-top: auto;
            font: 400 10.5px var(--f-mono);
            color: var(--on-ink-dim);
        }

        /* contrôles */
        .card-controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }
        .fc-btn {
            padding: 10px 16px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink-soft);
            font: 400 12px var(--f-ui);
            cursor: pointer;
            transition: var(--transition);
        }
        .fc-btn:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
        .fc-btn:disabled { opacity: .35; cursor: not-allowed; }
        .fc-btn.primary {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--paper);
            font-weight: 500;
            margin-left: auto;
        }
        .fc-btn.primary:hover:not(:disabled) { background: var(--ink-soft); border-color: var(--ink-soft); color: var(--paper); }

        /* notations : couleur de statut sur le filet + le texte, fond neutre */
        .fc-btn-green  { border-color: var(--status-known);    color: var(--status-known); }
        .fc-btn-orange { border-color: var(--status-learning); color: var(--status-learning); }
        .fc-btn-red    { border-color: var(--status-todo);     color: var(--status-todo); }
        .fc-btn-green:hover:not(:disabled)  { background: var(--status-known);    border-color: var(--status-known);    color: var(--paper); }
        .fc-btn-orange:hover:not(:disabled) { background: var(--status-learning); border-color: var(--status-learning); color: var(--paper); }
        .fc-btn-red:hover:not(:disabled)    { background: var(--status-todo);     border-color: var(--status-todo);     color: var(--paper); }

        /* écran de fin */
        .fc-end {
            border: 1px solid var(--line);
            padding: 34px;
            text-align: center;
        }
        .fc-end h2 { font: 300 30px var(--f-ed); color: var(--ink); margin-bottom: 14px; }
        .score-big { font: 400 46px/1 var(--f-ed); color: var(--ink); }

        /* ================================================================
           E. TEST
           ================================================================ */
        .test-wrap { max-width: 720px; }

        .test-hero { margin-bottom: 20px; }
        .test-hero h1 { font: 300 34px/1.1 var(--f-ed); color: var(--ink); }
        .test-hero p { margin-top: 8px; font: 400 10px var(--f-mono); color: var(--ink-mute); }

        .test-question-card {
            border: 1px solid var(--line);
            border-top: 1.5px solid var(--ink);
            padding: 34px 30px;
            text-align: center;
            margin: 18px 0 16px;
        }
        .test-dir-badge {
            font: 400 10px var(--f-ui);
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--ink-mute);
            margin-bottom: 18px;
        }
        .test-q-word { font: 500 46px/1.2 var(--f-kr); color: var(--ink); word-break: break-word; }
        .test-q-sub { margin-top: 10px; font: 300 15px var(--f-ed); font-style: italic; color: var(--ink-mute); }

        .test-input-row { display: flex; gap: 8px; margin-bottom: 14px; }
        .test-input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            font: 400 16px var(--f-kr);
            outline: none;
            transition: var(--transition);
        }
        .test-input::placeholder { font-family: var(--f-ui); font-size: 13px; color: var(--ink-faint); }
        .test-input:focus { border-color: var(--ink); }
        .test-input.correct { border-color: var(--status-known); color: var(--status-known); }
        .test-input.wrong   { border-color: var(--status-todo);  color: var(--status-todo); }
        .test-input:disabled { background: var(--paper-alt); }

        .test-submit-btn {
            padding: 12px 24px;
            border: 1px solid var(--ink);
            background: var(--ink);
            color: var(--paper);
            font: 500 12px var(--f-ui);
            cursor: pointer;
            transition: var(--transition);
        }
        .test-submit-btn:hover:not(:disabled) { background: var(--ink-soft); border-color: var(--ink-soft); }
        .test-submit-btn:disabled { opacity: .35; cursor: not-allowed; }

        .test-feedback {
            display: none;
            padding: 12px 16px;
            border: 1px solid var(--line);
            font: 400 13.5px var(--f-ui);
            margin-bottom: 14px;
        }
        .test-feedback.show { display: block; }
        .test-feedback.ok { border-color: var(--status-known); color: var(--status-known); }
        .test-feedback.ko { border-color: var(--status-todo);  color: var(--status-todo); background: var(--tint-red); }

        .test-next-btn {
            display: none;
            padding: 11px 22px;
            border: 1px solid var(--ink);
            background: transparent;
            color: var(--ink);
            font: 400 12px var(--f-ui);
            cursor: pointer;
            transition: var(--transition);
        }
        .test-next-btn.show { display: inline-flex; }
        .test-next-btn:hover { background: var(--ink); color: var(--paper); }

        /* résultats */
        .test-results { border-top: 1.5px solid var(--ink); padding-top: 26px; }
        .test-results h2 { font: 300 32px var(--f-ed); color: var(--ink); margin-bottom: 6px; }
        .test-score-display { font: 400 52px/1 var(--f-ed); color: var(--ink); margin: 14px 0 22px; }

        .test-wrong-list { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 16px; }

            font: 400 10px var(--f-ui) !important;

        .test-wrong-fr { font: 400 14px var(--f-ed); color: var(--status-known); }
        .test-wrong-your {
            width: 100%;
            font: 300 12.5px var(--f-ed);

            color: var(--status-todo);

        /* ================================================================
           F. CALENDRIER
           ================================================================ */
        .cal-hero { margin-bottom: 22px; }

        .cal-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 26px;
            align-items: start;

        .cal-main { border: 1px solid var(--line); }

        .cal-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 16px;
            background: var(--ink-surface);
            color: var(--on-ink);

        .cal-nav-btn {
            width: 26px; height: 26px;
            display: grid;
            place-items: center;
            border: 1px solid var(--ink-line);

        }
        .cal-nav-btn:hover { border-color: var(--on-ink); color: var(--on-ink); }
        .cal-month-title { font: 400 15px var(--f-ed); color: var(--on-ink); }
        .cal-today-btn {
            margin-left: auto;
            font: 400 11px var(--f-ui);
            color: var(--pastel-red);
            text-decoration: none;
        }
        .cal-today-btn:hover { color: var(--on-ink); }

        .cal-grid {
            display: grid;
            grid-template-columns: 44px repeat(7, minmax(0, 1fr));
        }

        .cal-weekdays { border-bottom: 1px solid var(--line); }
        .cal-weekday {
            padding: 9px 6px;

            font: 400 9.5px var(--f-ui);

            color: var(--ink-faint);

        .cal-cell:hover { background: var(--paper-alt); }
        .cal-empty { background: var(--paper-alt); cursor: default; }
        .cal-empty:hover { background: var(--paper-alt); }

        .cal-daynum { font: 400 12px var(--f-mono); color: var(--ink-soft); }

        .cal-today .cal-daynum {

        .cal-preview {
            display: block;

            color: var(--ink-mute);

            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;

        /* colonne « semaine » */
        .cal-weekcell {
            display: flex;

            align-items: center;

            gap: 5px;

            background: var(--paper-alt);
            text-decoration: none;

        .cal-wk-num { font: 400 9.5px var(--f-mono); color: var(--ink-faint); }
        .cal-wk-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--pastel-blue); }
        .cal-weekcell.has-vocab:hover { background: var(--tint-blue); }

        /* éditeur de note */
        .cal-editor {
            position: sticky;
            top: 16px;
            border: 1px solid var(--line);
            display: flex;
            flex-direction: column;
        }
        .cal-editor-head {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 11px 16px;
            background: var(--paper-alt);
            border-bottom: 1px solid var(--line);
            font: 400 12.5px var(--f-ui);
            color: var(--ink);
        }
        .cal-editor-head .icon-sm { color: var(--ink-mute); }

        .cal-textarea {
            border: none;
            outline: none;
            resize: vertical;
            min-height: 240px;
            padding: 16px;
            background: transparent;
            color: var(--ink);
            font: 400 13.5px/1.75 var(--f-ui);
        }
        .cal-textarea::placeholder { color: var(--ink-faint); }

        .cal-editor-foot {
            padding: 9px 16px;
            border-top: 1px solid var(--line);
            min-height: 32px;
        }
        .cal-save-status { font: 400 10px var(--f-mono); color: var(--ink-faint); }

        /* ================================================================
           G. RESPONSIVE — vues
           ================================================================ */

            .lesson-layout { grid-template-columns: minmax(0, 1fr); }
            .exo-side { position: static; max-height: none; }

        @media (max-width: 900px) {
            body.lesson-mode main { padding: 74px 18px 40px; }

            .fc-rates { flex-direction: row; flex-wrap: wrap; }

            .card-word { font-size: 56px; }

            .cal-preview { display: none; }
            .exo-cards { grid-template-columns: 1fr; }
        }
    </style>
</head>

    <script>
        // ================================================================
        // DATA (inlined from manifest.json — auto-updated by LLM)
        // ================================================================
        let MANIFEST = null;
        const bookCache = {};

        // ================================================================
        // CSV PARSER
        // ================================================================
        function parseCSV(text) {
            const rows = [];
            let row = [], field = '', inQ = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (inQ) {
                    if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
                    else field += ch;
                } else {
                    if (ch === '"') inQ = true;
                    else if (ch === ',') { row.push(field); field = ''; }
                    else if (ch === '\n' || ch === '\r') {
                        if (ch === '\r' && text[i + 1] === '\n') i++;
                        row.push(field); field = '';
                        if (row.some(f => f)) rows.push(row);
                        row = [];
                    } else field += ch;
                }
            }
            if (field || row.length) { row.push(field); if (row.some(f => f)) rows.push(row); }
            return rows;
        }

        function parseVocabCSV(text, bookId) {
            const rows = parseCSV(text);
            const chapters = {};
            let cur = 0;
            let total = 0;
            for (let i = 1; i < rows.length; i++) {
                const [h = '', fr = '', ex = '', tr = '', expl = ''] = rows[i].map(s => s.trim());
                if (h && /^\d+과$/.test(h) && !fr) {
                    cur = parseInt(h);
                    if (!chapters[cur]) chapters[cur] = [];
                    continue;
                }
                if (!h && !fr) continue;
                if (!chapters[cur]) chapters[cur] = [];
                chapters[cur].push({ hangul: h, french: fr, example: ex, translated: tr, explanation: expl });
                total++;
            }
            return { id: bookId, name: `Vocab ${bookId}`, chapters, total };
        }

        async function fetchBook(bookId) {
            if (bookCache[bookId]) return bookCache[bookId];
            // Livre-semaine synthétique : id "W<date>" → CSV plat dans content/weekly/
            if (bookId && bookId[0] === 'W') {
                const w = weekById(bookId.slice(1));
                if (w) {
                    const res = await fetch(`content/weekly/${w.file}`);
                    const words = parseFlatVocabCSV(await res.text());
                    bookCache[bookId] = { id: bookId, name: weekLabel(w), chapters: { 1: words }, total: words.length, isWeek: true, week: w };
                    return bookCache[bookId];
                }
            }
            const res = await fetch(`content/vocab/Vocab ${bookId}.csv`);
            const text = await res.text();
            bookCache[bookId] = parseVocabCSV(text, bookId);
            return bookCache[bookId];
        }

        // ================================================================
        // WEEKLY VOCAB (vocab annexe, hors leçon) — helpers
        // ================================================================
        // Un livre-semaine réutilise tout le moteur vocab/flashcard/test via
        // l'id synthétique "W<date>" (chapitre unique = 1).
        function getWeeks() { return (MANIFEST.weeks || []).slice().sort((a, b) => (a.start < b.start ? 1 : -1)); }
        function weekById(id) { return (MANIFEST.weeks || []).find(w => w.id === id) || null; }
        function weekBookId(id) { return 'W' + id; }

        // "29 juin → 5 juil. 2026"
        function weekLabel(w) {
            const shortMon = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
            const [ys, ms, ds] = w.start.split('-').map(Number);
            const [ye, me, de] = w.end.split('-').map(Number);
            const s = `${ds} ${shortMon[ms - 1]}`;
            const e = `${de} ${shortMon[me - 1]} ${ye}`;
            return `${s} → ${e}`;
        }

        // CSV plat (header optionnel, pas de séparateur "N과") → liste de mots
        function parseFlatVocabCSV(text) {
            const rows = parseCSV(text);
            const out = [];
            for (let i = 0; i < rows.length; i++) {
                const [h = '', fr = '', ex = '', tr = '', expl = ''] = rows[i].map(s => s.trim());
                if (i === 0 && (h === '한글' || h.toLowerCase() === 'hangul')) continue; // header
                if (!h && !fr) continue;
                out.push({ hangul: h, french: fr, example: ex, translated: tr, explanation: expl });
            }
            return out;
        }

        // Télécharge une semaine = CSV plat (header + mots, + custom éventuels).
        function downloadWeek(bookId) {
            const book = bookCache[bookId];
            if (!book) return;
            const custom = getCustomWords(bookId);
            const words = [...(book.chapters[1] || []), ...(custom[1] || [])];
            const lines = [VOCAB_CSV_HEADER.join(',')];
            for (const w of words) lines.push(wordRowCSV(w));
            triggerDownload(`Vocab semaine ${book.week.start}.csv`, lines.join('\r\n'), 'text/csv');
        }

        // ================================================================
        // DOWNLOAD HELPERS
        // ================================================================
        function triggerDownload(filename, content, mime) {
            // BOM en tête → Excel ouvre correctement l'UTF-8 (한글)
            const blob = new Blob(['﻿', content], { type: `${mime};charset=utf-8` });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function csvEscape(v) {
            v = (v == null ? '' : String(v));
            return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
        }

        const VOCAB_CSV_HEADER = ['한글', 'French', 'Example Sentence', 'Translated Sentence', 'Explanation'];

        function wordRowCSV(w) {
            return [w.hangul, w.french, w.example, w.translated, w.explanation].map(csvEscape).join(',');
        }

        // Télécharge le vocab : un chapitre précis (chapter = n) ou tout le livre (chapter = null),
        // en reproduisant le format source (lignes séparatrices "N과").
        function downloadVocab(bookId, chapter) {
            const book = bookCache[bookId];
            if (!book) return;
            const custom = getCustomWords(bookId);
            const lines = [VOCAB_CSV_HEADER.join(',')];
            const chapNums = chapter != null
                ? [chapter]
                : Object.keys(book.chapters).map(Number).sort((a, b) => a - b);
            for (const n of chapNums) {
                lines.push(`${csvEscape(`${n}과`)},,,,`);
                const words = [...(book.chapters[n] || []), ...(custom[n] || [])];
                for (const w of words) lines.push(wordRowCSV(w));
            }
            const name = chapter != null ? `Vocab ${bookId} - ${chapter}과.csv` : `Vocab ${bookId}.csv`;
            triggerDownload(name, lines.join('\r\n'), 'text/csv');
        }

        // Télécharge une leçon = son fichier HTML source, tel quel (self-contained).
        async function downloadLesson(level, filename) {
            const decodedFile = decodeURIComponent(filename);
            try {
                const res = await fetch(`content/lessons/${level}/${decodedFile}`);
                if (!res.ok) throw new Error(res.status);
                triggerDownload(decodedFile, await res.text(), 'text/html');
            } catch (e) {
                alert(`Téléchargement impossible : ${e.message}`);
            }
        }

        // ================================================================
        // EXO — exercices de traduction (markdown → panneau)
        // ================================================================
        const exoMdCache = {};

        // Liste des fichiers exo d'un 과 depuis le manifest (ex: "4A", "1")
        function getExoList(level, gwa) {
            return (MANIFEST.exos && MANIFEST.exos[level] && MANIFEST.exos[level][String(gwa)]) || [];
        }

        async function fetchExoMd(level, gwa, filename) {
            const key = `${level}/${gwa}/${filename}`;
            if (exoMdCache[key]) return exoMdCache[key];
            const res = await fetch(`content/exos/${level}/${gwa}과/${encodeURIComponent(filename)}`);
            if (!res.ok) throw new Error(res.status);
            const md = await res.text();
            exoMdCache[key] = md;
            return md;
        }

        // --- mini markdown (sous-ensemble utilisé par les exos) ---
        function exoInline(s) {
            return s
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                // Mot de vocab : [[français|한글]] → survol = bulle avec la trad coréenne
                .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,
                    '<span class="vocab-hint" tabindex="0">$1<span class="vocab-tip">$2</span></span>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>');
        }

        // Rend un bloc de lignes (listes ordonnées/à puces, paragraphes, notes)
        function exoBlock(lines) {
            let out = '', listType = null, buf = [];
            const flush = () => {
                if (listType) out += `<${listType}>` + buf.map(x => `<li>${exoInline(x)}</li>`).join('') + `</${listType}>`;
                buf = []; listType = null;
            };
            for (const l of lines) {
                if (!l) { flush(); continue; }
                const ol = l.match(/^\d+\.\s+(.*)/);
                const ul = l.match(/^-\s+(.*)/);
                if (ol) { if (listType && listType !== 'ol') flush(); listType = 'ol'; buf.push(ol[1]); }
                else if (ul) { if (listType && listType !== 'ul') flush(); listType = 'ul'; buf.push(ul[1]); }
                else {
                    flush();
                    const note = l.match(/^\*(.+)\*$/);
                    out += note ? `<p class="exo-note">${exoInline(note[1])}</p>` : `<p>${exoInline(l)}</p>`;
                }
            }
            flush();
            return out;
        }

        // Convertit le markdown d'un exo en HTML : les blocs "Correction(s)" sont
        // repliés dans un <details> (on traduit d'abord, on vérifie ensuite).
        function parseExoMarkdown(md) {
            const sections = [];
            let cur = null;
            for (const raw of md.split(/\r?\n/)) {
                const t = raw.trim();
                if (t.startsWith('# ')) continue; // titre du doc, ignoré
                const hdr = t.match(/^\*\*(.+?)\*\*$/);
                if (hdr) { cur = { header: hdr[1], isCorr: /correction/i.test(hdr[1]), body: [] }; sections.push(cur); continue; }
                if (!cur) { cur = { header: null, isCorr: false, body: [] }; sections.push(cur); }
                cur.body.push(t);
            }
            return sections.map(s => {
                const body = exoBlock(s.body);
                if (s.header == null) return body;
                if (s.isCorr) return `<details class="exo-corr"><summary><i data-lucide="eye" class="icon-xs"></i> ${exoInline(s.header)}</summary><div class="exo-corr-body">${body}</div></details>`;
                return `<h4 class="exo-h">${exoInline(s.header)}</h4>${body}`;
            }).join('');
        }

        // Panneau leçon : simple liste de liens vers chaque page d'exo (Exo 1..N)
        function exoLinksList(level, gwa) {
            const list = getExoList(level, gwa);
            if (!list.length) return `<div class="empty-state" style="padding:18px">Aucun exercice pour ce 과.</div>`;
            return `<div class="exo-links">${list.map((f, i) =>
                `<a href="#exo/${level}/${gwa}/${i}" class="exo-card">
                    <span class="exo-card-num">${i + 1}</span>
                    <span class="exo-card-title">${f.replace('.md', '')}</span>
                    <span class="exo-card-arrow">→</span>
                </a>`).join('')}</div>`;
        }

        // Coquille du panneau exo : barre d'onglets + zone de contenu
        function exoPanelShell(level, gwa, barId, bodyId) {
            const list = getExoList(level, gwa);
            if (!list.length) return `<div class="empty-state">Aucun exercice pour ce 과 pour l'instant.</div>`;
            const tabs = list.map((f, i) =>
                `<button class="exo-tab${i === 0 ? ' active' : ''}" onclick="exoSelectTab('${barId}','${bodyId}','${level}','${gwa}',${i})">${f.replace('.md', '')}</button>`
            ).join('');
            return `<div class="exo-tabs" id="${barId}">${tabs}</div><div class="exo-content" id="${bodyId}"></div>`;
        }

        function exoSelectTab(barId, bodyId, level, gwa, index) {
            document.querySelectorAll(`#${barId} .exo-tab`).forEach((t, i) => t.classList.toggle('active', i === index));
            loadExoInto(bodyId, level, gwa, index);
        }

        async function loadExoInto(bodyId, level, gwa, index) {
            const body = document.getElementById(bodyId);
            if (!body) return;
            const list = getExoList(level, gwa);
            const filename = list[index];
            if (!filename) { body.innerHTML = `<div class="empty-state">Aucun exercice.</div>`; return; }
            body.innerHTML = `<div class="loading">Chargement…</div>`;
            try {
                const md = await fetchExoMd(level, gwa, filename);
                body.innerHTML = `<div class="exo-render">${parseExoMarkdown(md)}</div>`;
                lucide.createIcons();
            } catch (e) {
                body.innerHTML = `<div class="empty-state">Erreur de chargement : ${e.message}</div>`;
            }
        }

        async function downloadExo(level, gwa, index) {
            const list = getExoList(level, gwa);
            const filename = list[index];
            if (!filename) return;
            try {
                const md = await fetchExoMd(level, gwa, filename);
                triggerDownload(`${level} ${gwa}과 - ${filename}`, md, 'text/markdown');
            } catch (e) { alert(`Téléchargement impossible : ${e.message}`); }
        }

        // Page de navigation Exo : Level > 과 > Exo 1..N (une seule page, pas de sous-menu sidebar)
        function renderExos(filterLevel) {
            document.getElementById('sidebar-extra').innerHTML = '';
            const all = MANIFEST.exos || {};
            const levels = filterLevel ? Object.keys(all).filter(l => l === filterLevel) : Object.keys(all);

            const levelsHTML = levels.map(lvl => {
                const cls = lvl.startsWith('3') ? 'l3' : 'l4';
                const gwaNums = Object.keys(all[lvl]).sort((a, b) => parseInt(a) - parseInt(b));
                const gwaHTML = gwaNums.map(gwa => {
                    const exos = all[lvl][gwa];
                    const cards = exos.map((f, i) => {
                        const label = f.replace('.md', '');
                        return `<a href="#exo/${lvl}/${gwa}/${i}" class="exo-card">
                            <span class="exo-card-num">${i + 1}</span>
                            <span class="exo-card-title">${label}</span>
                            <span class="exo-card-arrow">→</span>
                        </a>`;
                    }).join('');
                    const lessonFile = encodeURIComponent(`${lvl} 과${gwa}.html`);
                    return `<div class="exo-gwa-block">
                        <div class="exo-gwa-head">
                            <span class="exo-gwa-title"><i data-lucide="book-open" class="icon-sm"></i> ${gwa}과</span>
                            <a href="#lesson/${lvl}/${lessonFile}" class="exo-gwa-lesson">Voir avec la leçon →</a>
                        </div>
                        <div class="exo-cards">${cards}</div>
                    </div>`;
                }).join('');
                return `<div class="level-group">
                    <div class="level-group-header">
                        <div class="level-group-icon ${cls}"><i data-lucide="folder"></i></div>
                        <span class="level-group-title">Level ${lvl}</span>
                        <span class="level-group-badge ${cls}">${gwaNums.length} 과</span>
                    </div>
                    ${gwaHTML}
                </div>`;
            }).join('') || `<div class="empty-state">Aucun exercice pour l'instant.</div>`;

            document.getElementById('content').innerHTML = `
        <div class="hero">
            <h1><span class="kr">연습</span> Exercices</h1>
            <p class="subtitle">Traduction FR → coréen, par 과</p>
        </div>
        ${levelsHTML}
    `;
            lucide.createIcons();
        }

        // Vue standalone d'un exo (avec onglets frères + lien vers la leçon)
        function renderExoStandalone(level, gwa, index) {
            document.getElementById('sidebar-extra').innerHTML = '';
            const lessonFile = encodeURIComponent(`${level} 과${gwa}.html`);
            document.getElementById('content').innerHTML = `
        <div class="lesson-viewer-bar">
            <a href="#exos">← Retour aux exos</a>
            <span class="crumb">/ Level ${level} / ${gwa}과</span>
            <a href="#lesson/${level}/${lessonFile}" class="dl-btn" style="margin-left:auto"><i data-lucide="book-open" class="icon-xs"></i> Ouvrir la leçon</a>
            <button class="dl-btn" onclick="downloadExo('${level}','${gwa}', document.querySelector('#exo-bar-std .exo-tab.active').dataset.idx|0)"><i data-lucide="download" class="icon-xs"></i> Télécharger</button>
        </div>
        <div class="exo-standalone">
            ${exoPanelShell(level, gwa, 'exo-bar-std', 'exo-body-std')}
        </div>
    `;
            lucide.createIcons();
            // marque l'index sur chaque onglet (pour le bouton télécharger) + active le bon
            document.querySelectorAll('#exo-bar-std .exo-tab').forEach((t, i) => { t.dataset.idx = i; });
            exoSelectTab('exo-bar-std', 'exo-body-std', level, gwa, index || 0);
        }

        // ================================================================
        // ROUTING
        // ================================================================
        function getRoute() {
            const h = decodeURIComponent(location.hash || '#');
            const parts = h.slice(1).split('/').filter(Boolean);
            return { page: parts[0] || '', args: parts.slice(1) };
        }

        window.addEventListener('hashchange', route);
        window.addEventListener('load', async () => {
            const res = await fetch('content/manifest.json');
            MANIFEST = await res.json();
            route();
        });

        async function route() {
            const { page, args } = getRoute();
            setNavActive(page);
            document.body.classList.toggle('lesson-mode', page === 'lesson' || page === 'exo');
            const el = document.getElementById('content');
            el.innerHTML = '<div class="loading">Chargement…</div>';
            lucide.createIcons();

            if (!page || page === '') { await renderHome(); }
            else if (page === 'weekly') { await renderWeekList(); }
            else if (page === 'vocab') { await renderVocab(args[0], args[1] ? parseInt(args[1]) : null); }
            else if (page === 'lessons') { renderLessons(args[0] || null); }
            else if (page === 'lesson') { renderLesson(args[0], args.slice(1).join('/')); }
            else if (page === 'exos') { renderExos(args[0] || null); }
            else if (page === 'exo') { renderExoStandalone(args[0], args[1], args[2] ? parseInt(args[2]) : 0); }
            else if (page === 'flashcard') { await renderFlashcard(args[0] || null, args[1] ? parseInt(args[1]) : null, args[2] ? parseInt(args[2]) : null); }
            else if (page === 'test') { await renderTest(args[0] || null, args[1] ? parseInt(args[1]) : null); }
            else if (page === 'youtube') { await renderYoutube(); }
            else if (page === 'calendar') { renderCalendar(args[0] || null); }
        }

        function setNavActive(page) {
            const { args } = getRoute();
            const weekCtx = page === 'weekly' || ((page === 'vocab' || page === 'flashcard' || page === 'test') && (args[0] || '')[0] === 'W');
            document.getElementById('nav-weekly').classList.toggle('active', weekCtx);
            document.getElementById('nav-vocab').classList.toggle('active', !page || page === '' || (page === 'vocab' && !weekCtx));
            document.getElementById('nav-lessons').classList.toggle('active', page === 'lessons' || page === 'lesson');
            document.getElementById('nav-exos').classList.toggle('active', page === 'exos' || page === 'exo');
            document.getElementById('nav-flashcard').classList.toggle('active', page === 'flashcard' && !weekCtx);
            document.getElementById('nav-test').classList.toggle('active', page === 'test' && !weekCtx);
            document.getElementById('nav-youtube').classList.toggle('active', page === 'youtube');
            document.getElementById('nav-calendar').classList.toggle('active', page === 'calendar');
        }

        async function renderWeekList() {
            document.getElementById('sidebar-extra').innerHTML = '';
            const weeks = getWeeks();
            if (!weeks.length) {
                document.getElementById('content').innerHTML = `
            <div class="hero"><h1><span class="kr">주간 단어</span> Vocab semaine</h1>

            // Charge chaque semaine + calcule la barre de maîtrise depuis le level store

                });

                    ${none ? `<span style="flex:${none};background:var(--border)"></span>` : ''}
                </div>`;

        <div class="hero">
            <h1><span class="kr">주간 단어</span> Vocab semaine</h1>
            <p class="subtitle">Le vocab que tu apprends hors leçon, rangé par semaine. Table, flashcards et test — comme les 과.</p>
        </div>
        <div class="week-grid">${cards.join('')}</div>`;
            lucide.createIcons();
        }

        // Bloc « Progression » en pied de sidebar (maquette vocabulaire) :
        // barre encre remplie par les mots maîtrisés + segment pastel pour
        // ceux en cours. Données réelles issues du level store — aucun compteur
        // inventé (pas de série/streak : cette donnée n'existe pas côté app).
        function sidebarProgress(bookId, book, chNums) {
            const lvl = getLvlStore(bookId);
            let known = 0, learning = 0;
            chNums.forEach(n => (book.chapters[n] || []).forEach(w => {
                const l = lvl[`${n}_${w.hangul}`];
                if (l === 'green') known++; else if (l === 'orange') learning++;
            }));
            const total = book.total || 1;
            const pct = Math.round((known / total) * 100);
            return `<div class="side-progress">
            <div class="side-progress-label">Progression ${bookId}</div>
            <div class="side-progress-bar">
                <span style="width:${(known / total) * 100}%;background:#fff"></span>
                <span style="width:${(learning / total) * 100}%;background:var(--pastel-red)"></span>
            </div>
            <div class="side-progress-foot"><span>${known} / ${total}</span><span>${pct}%</span></div>
        </div>`;
        }

            </a>`).join('')}

    `;
            } else {

                document.getElementById('sidebar-extra').innerHTML = `
        <div class="nav-section-label">책 · Livres</div>
        <div class="side-books">${books.map(b => `<a href="#vocab/${b.id}" class="side-book ${b.id === bookId ? 'active' : ''}">${b.id}</a>`).join('')}</div>
        <div class="nav-section-label">과 · Chapitres</div>
        <div class="sidebar-sub">

                <span class="side-chap-n">전체</span><span class="side-chap-c">${book.total}</span>
            </a>
            ${chNums.map(n => `
            <a href="#vocab/${bookId}/${n}" class="sidebar-link side-chap ${selectedChapter === n ? 'active' : ''}">
                <span class="side-chap-n">제${n}과</span><span class="side-chap-c">${book.chapters[n].length}</span>
            </a>`).join('')}
        </div>
        ${sidebarProgress(bookId, book, chNums)}

            // Build table rows (with level dot + custom words from localStorage)

                    counter++;
                    const key = `${n}_${e.hangul}`;
                    return `<tr class="vocab-row" data-hangul="${e.hangul.toLowerCase()}" data-french="${e.french.toLowerCase()}" data-level="none" data-lkey="${key}" onclick="this.classList.toggle('expanded')">
                <td class="col-level" onclick="cycleLvl(this.parentElement,event)"><span class="level-dot"></span></td>
                <td style="color:var(--text-muted);font-size:0.8rem">${counter}</td>

                <td class="col-translated example-col">${e.translated}</td>
                <td class="col-explanation detail-col" style="display:none">${e.explanation}</td>
            </tr>`;
                }).join('');
                return sepRow + wordRows;
            }).join('');

            document.getElementById('content').innerHTML = `
        <div class="vocab-header">
            <div class="vocab-title-group">
                <p class="breadcrumb"><a href="#"><i data-lucide="home" class="icon-xs"></i> Home</a> → ${isWeek ? `<a href="#weekly">Vocab semaine</a> → ` : ''}${book.name}</p>
                <h1>${isWeek ? `<span class="kr">주간 단어</span> ${book.name}` : book.name}</h1>
                ${isWeek ? `<p class="week-sub">Vocab annexe — mots appris hors leçon cette semaine.</p>` : ''}
            </div>
            <button class="dl-btn" onclick="${isWeek ? `downloadWeek('${bookId}')` : `downloadVocab('${bookId}', ${selectedChapter === null ? 'null' : selectedChapter})`}">
                <i data-lucide="download" class="icon-xs"></i> ${isWeek ? 'Télécharger la semaine (CSV)' : (selectedChapter === null ? 'Télécharger le livre (CSV)' : `Télécharger ${selectedChapter}과 (CSV)`)}
            </button>
        </div>
        <div class="stats-bar">
            <div class="stat-card"><div class="stat-value purple">${counter}</div><div class="stat-label">Total mots</div></div>
            ${isWeek ? '' : `<div class="stat-card"><div class="stat-value pink">${chNums.length}</div><div class="stat-label">Chapitres</div></div>
            <div class="stat-card"><div class="stat-value cyan">${chNums.length ? Math.round(counter / chNums.length) : 0}</div><div class="stat-label">Mots / chapitre</div></div>`}
            <div class="stat-card"><div class="stat-value green" id="count-green">0</div><div class="stat-label">Maîtrisés 🟢</div></div>

            <div class="stat-card"><div class="stat-value" style="color:var(--red)" id="count-red">0</div><div class="stat-label">À apprendre 🔴</div></div>
        </div>
        ${isWeek ? '' : `<div class="chapter-nav">

            </a>
            ${chNums.map(n => `
            <a href="#vocab/${bookId}/${n}" class="ch-pill ${selectedChapter === n ? 'active' : ''}">

            </a>`).join('')}
        </div>`}
        ${selectedChapter !== null ? `

            <a href="#flashcard/${bookId}/${selectedChapter}" class="practice-btn">
                <i data-lucide="layers" class="icon-xs"></i> Flashcards${isWeek ? '' : ` — ${selectedChapter}과`}
            </a>
            <a href="#test/${bookId}/${selectedChapter}" class="practice-btn test-btn">
                <i data-lucide="check-square" class="icon-xs"></i> Test${isWeek ? '' : ` — ${selectedChapter}과`}
            </a>

        <div class="controls">
            <div class="search-box">

        </div>
    `;
            lucide.createIcons();
            // Apply saved levels
            applyLevelsFromStorage(bookId);
        }

        // ================================================================
        // LEVEL SYSTEM (localStorage)
        // ================================================================
        const LVL_CYCLE = ['none', 'green', 'orange', 'red'];
        let _currentLvlFilter = 'all';
        let _lvlFilterActive = false;

        function getLvlStore(bookId) { try { return JSON.parse(localStorage.getItem(`mew_lvl_${bookId}`) || '{}'); } catch { return {}; } }
        function saveLvlStore(bookId, data) {
            localStorage.setItem(`mew_lvl_${bookId}`, JSON.stringify(data));
            // Persiste côté serveur (fichier JSON partagé) pour que le niveau
            // soit le même sur tous les appareils, sans compte ni session.
            fetch(`api/levels.php?book=${encodeURIComponent(bookId)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data),

        // Récupère la copie serveur et l'utilise comme cache local avant de rendre
        // la page, pour refléter les changements faits depuis un autre appareil.
        async function syncLvlStore(bookId) {
            try {
                const res = await fetch(`api/levels.php?book=${encodeURIComponent(bookId)}`);
                if (!res.ok) return;
                const remote = await res.json();
                if (remote && typeof remote === 'object' && !Array.isArray(remote)) {
                    localStorage.setItem(`mew_lvl_${bookId}`, JSON.stringify(remote));
                }
            } catch (e) { /* hors-ligne ou API indisponible — on garde le cache local */ }
        }

        function applyLevelsFromStorage(bookId) {
            const data = getLvlStore(bookId);
            document.querySelectorAll('.vocab-row').forEach(tr => {

                tr.dataset.level = lvl;
            });
            updateLvlStats();
        }

        function cycleLvl(tr, e) {
            e.stopPropagation();
            const cur = tr.dataset.level || 'none';
            const next = LVL_CYCLE[(LVL_CYCLE.indexOf(cur) + 1) % LVL_CYCLE.length];
            tr.dataset.level = next;
            // Save
            const bookId = getRoute().args[0];
            const data = getLvlStore(bookId);
            data[tr.dataset.lkey] = next;
            saveLvlStore(bookId, data);
            updateLvlStats();
            filterVocab();
        }

            const resize = () => {
                try {
                    const doc = frame.contentDocument || frame.contentWindow.document;
                    const h = Math.max(
                        doc.body.scrollHeight, doc.documentElement.scrollHeight,

        // ================================================================
        // CALENDRIER — notes quotidiennes (localStorage)
        // ================================================================
        const MONTHS_FR = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
            'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
        const DAYS_FR = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];

        function getCalNotes() { try { return JSON.parse(localStorage.getItem('mew_calendar') || '{}'); } catch { return {}; } }
        function saveCalNotes(d) { localStorage.setItem('mew_calendar', JSON.stringify(d)); }
        const calKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        // Numéro de semaine ISO 8601
        function isoWeek(d) {
            const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const day = (t.getUTCDay() + 6) % 7;      // lundi = 0
            t.setUTCDate(t.getUTCDate() - day + 3);    // jeudi de la semaine
            const firstThu = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
            const firstDay = (firstThu.getUTCDay() + 6) % 7;
            firstThu.setUTCDate(firstThu.getUTCDate() - firstDay + 3);
            return 1 + Math.round((t - firstThu) / (7 * 24 * 3600 * 1000));
        }

        let _calMonth = null;    // Date sur le 1er du mois affiché
        let _calSelected = null; // clé YYYY-MM-DD du jour sélectionné

        function renderCalendar(ym) {
            document.getElementById('sidebar-extra').innerHTML = '';
            const today = new Date();
            if (ym && /^\d{4}-\d{2}$/.test(ym)) {
                const [y, m] = ym.split('-').map(Number);
                _calMonth = new Date(y, m - 1, 1);
            } else if (!_calMonth) {
                _calMonth = new Date(today.getFullYear(), today.getMonth(), 1);
            }
            if (!_calSelected) _calSelected = calKey(today);

            const year = _calMonth.getFullYear();
            const month = _calMonth.getMonth();
            const notes = getCalNotes();
            const todayKey = calKey(today);

            const first = new Date(year, month, 1);
            const offset = (first.getDay() + 6) % 7; // lundi = 0
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const prev = `${month === 0 ? year - 1 : year}-${String(month === 0 ? 12 : month).padStart(2, '0')}`;
            const next = `${month === 11 ? year + 1 : year}-${String(month === 11 ? 1 : month + 2).padStart(2, '0')}`;

            const slots = offset + daysInMonth;
            const rows = Math.ceil(slots / 7);
            let cells = '';
            for (let r = 0; r < rows; r++) {
                // Lundi de la ligne → sert de clé de semaine (ids de semaines = lundis)
                const monday = new Date(year, month, 1 - offset + r * 7);
                const wKey = calKey(monday);
                const wk = weekById(wKey);
                if (wk) {
                    cells += `<a class="cal-weekcell has-vocab" href="#vocab/${weekBookId(wk.id)}/1" title="Vocab semaine — ${weekLabel(wk)}">
                        <span class="cal-wk-num">S${isoWeek(monday)}</span><span class="cal-wk-dot"></span>
                    </a>`;
                } else {
                    cells += `<div class="cal-weekcell"><span class="cal-wk-num">S${isoWeek(monday)}</span></div>`;
                }
                for (let s = 0; s < 7; s++) {
                    const d = r * 7 + s - offset + 1;
                    if (d < 1 || d > daysInMonth) { cells += `<div class="cal-cell cal-empty"></div>`; continue; }
                    const dd = new Date(year, month, d);
                    const key = calKey(dd);
                    const note = notes[key];
                    const cls = ['cal-cell'];
                    if (key === todayKey) cls.push('cal-today');
                    if (key === _calSelected) cls.push('cal-selected');
                    if (note && note.trim()) cls.push('cal-has-note');
                    cells += `<div class="${cls.join(' ')}" data-key="${key}" onclick="selectCalDay('${key}')">
                        <span class="cal-daynum">${d}</span>
                        ${note && note.trim() ? `<span class="cal-dot"></span><span class="cal-preview">${escapeHtml(note.trim())}</span>` : ''}
                    </div>`;
                }
            }

            document.getElementById('content').innerHTML = `
        <div class="hero cal-hero">
            <h1><span class="kr">달력</span> Calendrier</h1>
            <p class="subtitle">Note ce que tu veux, jour par jour.</p>
        </div>
        <div class="cal-layout">
            <div class="cal-main">
                <div class="cal-toolbar">
                    <a class="cal-nav-btn" href="#calendar/${prev}"><i data-lucide="chevron-left" class="icon-sm"></i></a>
                    <div class="cal-month-title">${MONTHS_FR[month]} ${year}</div>
                    <a class="cal-nav-btn" href="#calendar/${next}"><i data-lucide="chevron-right" class="icon-sm"></i></a>
                    <a class="cal-today-btn" href="#calendar/${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}" onclick="_calSelected='${todayKey}'">Aujourd'hui</a>
                </div>
                <div class="cal-grid cal-weekdays">
                    <div class="cal-weekday cal-wk-head">Sem.</div>
                    ${DAYS_FR.map(d => `<div class="cal-weekday">${d}</div>`).join('')}
                </div>
                <div class="cal-grid cal-days">${cells}</div>
            </div>
            <div class="cal-editor" id="cal-editor"></div>
        </div>
    `;
            drawCalEditor();
            lucide.createIcons();
        }

        function selectCalDay(key) {
            _calSelected = key;
            document.querySelectorAll('.cal-cell.cal-selected').forEach(c => c.classList.remove('cal-selected'));
            const cell = document.querySelector(`.cal-cell[data-key="${key}"]`);

        let _calSaveTimer = null;
        function onCalInput(val) {
            const notes = getCalNotes();
            if (val.trim()) notes[_calSelected] = val; else delete notes[_calSelected];
            saveCalNotes(notes);
            // Met à jour la cellule (dot + aperçu) en direct.

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // ================================================================
        // FLASHCARD
        // ================================================================
        let _fc = {};  // flashcard state

        // 4A/4B : vocab découpé en 7 lots égaux (1 par jour du cycle leçon J1-J7).
        // 3A/3B (déjà vus) : legacy, lots fixes de 10 mots ("semaines").
        const FC_DAILY_BOOKS = ['4A', '4B'];
        function fcIsDaily(bookId) { return FC_DAILY_BOOKS.includes(bookId); }
        function fcGroups(words, bookId) {
            if (!fcIsDaily(bookId)) {
                const groups = [];
                for (let i = 0; i < words.length; i += 10) groups.push(words.slice(i, i + 10));
                return groups;
            }
            const n = 7, len = words.length, base = Math.floor(len / n), rem = len % n;
            const groups = []; let idx = 0;
            for (let i = 0; i < n; i++) {
                const size = base + (i >= n - rem ? 1 : 0);
                groups.push(words.slice(idx, idx + size));
                idx += size;
            }
            return groups;
        }
        function fcUnitLabel(bookId, short) {
            return fcIsDaily(bookId) ? (short ? 'J' : 'Jour') : (short ? 'S' : 'Semaine');
        }

        async function renderFlashcard(bookId, chapter, week) {
            // If no book selected, show book/chapter picker
            const books = MANIFEST.books;
            if (!bookId) {
                document.getElementById('sidebar-extra').innerHTML = '';

            <div class="fc-wrap">

                        <div class="book-title">Vocab ${b}</div>
                    </a>`).join('')}
                </div>
            </div>`;
                lucide.createIcons(); return;
            }
            const book = await fetchBook(bookId);
            await syncLvlStore(bookId);
            const chNums = Object.keys(book.chapters).map(Number).sort((a, b) => a - b);
            if (chapter === null) {
                document.getElementById('sidebar-extra').innerHTML = '';

                const lvlData = getLvlStore(bookId);
                const levelCounts = (chNum, wordList) => {
                    let g = 0, o = 0, r = 0, none = 0;
                    wordList.forEach(w => {
                        const lvl = lvlData[`${chNum}_${w.hangul}`] || 'none';
                        if (lvl === 'green') g++; else if (lvl === 'orange') o++; else if (lvl === 'red') r++; else none++;
                    });
                    return { g, o, r, none };
                };
                const masteryBar = (c) => `<div class="mastery-bar">
                    ${c.g ? `<span style="flex:${c.g};background:var(--green)"></span>` : ''}
                    ${c.o ? `<span style="flex:${c.o};background:var(--orange)"></span>` : ''}
                    ${c.r ? `<span style="flex:${c.r};background:var(--red)"></span>` : ''}
                    ${c.none ? `<span style="flex:${c.none};background:var(--border)"></span>` : ''}
                </div>`;

                document.getElementById('content').innerHTML = `
            <div class="fc-wrap">
                <div class="fc-hero">
                    <h1>Flashcards — ${book.isWeek ? book.name : bookId}</h1>
                    <p>Choisissez un chapitre entier, ou ${fcIsDaily(bookId) ? 'un jour (aligné sur le cycle leçon)' : 'une semaine (lot de 10 mots)'} ciblé :</p>
                </div>
                <div class="fc-chapters-grid">
                    ${chNums.map(n => {
                        const words = book.chapters[n];
                        const groups = fcGroups(words, bookId);
                        const unit = fcUnitLabel(bookId, true);
                        const weekChips = groups.map((g, i) => {
                            const w = i + 1;
                            return `<a href="#flashcard/${bookId}/${n}/${w}" class="fc-week-chip">
                                <span class="fc-week-num">${unit}${w}</span>
                                <span class="fc-week-count">${g.length} mots</span>
                                ${masteryBar(levelCounts(n, g))}
                            </a>`;
                        }).join('');
                        return `<div class="fc-chapter-card">

            }

            const chapterWords = [...(book.chapters[chapter] || [])];
            const chapterGroups = fcGroups(chapterWords, bookId);
            const totalWeeks = chapterGroups.length;
            if (week !== null && (week < 1 || week > totalWeeks)) week = null;

            }).join('')}
        </div>`;

            const rawWords = week ? chapterGroups[week - 1] : chapterWords;
            const weekStartIdx = week ? chapterGroups.slice(0, week - 1).reduce((s, g) => s + g.length, 0) : 0;
            // Shuffle helper
            function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }

            _fc = {
                bookId, chapter, week,
                rawWords,
                levelFilter: { green: true, orange: true, red: true, none: true },
                words: [],
                idx: 0,
                mode: 'alternate',  // 'kr', 'fr', 'alternate'
                correct: 0, wrong: 0,
                flipped: false,
                marks: [],          // note donnée par carte sur la session (barre de segments)
            };
            _fc.words = shuffle(fcFilteredWords());

            // Bloc « 오늘의 묶음 · Paquet du jour » (maquette flashcards) : portée du
            // paquet + compteurs cartes / restantes, tenus à jour par fcRenderCard.
            document.getElementById('sidebar-extra').insertAdjacentHTML('beforeend', `
        <div class="side-deck">
            <div class="nav-section-label">오늘의 묶음</div>
            <div class="side-deck-scope">${bookId} · ${chapter}과${week ? ` · ${fcUnitLabel(bookId, false)} ${week}` : ''}</div>
            <div class="side-deck-stats">

            </div>
        </div>`);

            // Le rendu de carte est centralisé dans la fonction globale fcRenderCard()
            // (lit l'état _fc), partagée avec fcNav/fcSetMode pour éviter toute
            // divergence entre le rendu initial et les re-rendus.
            const renderCard = fcRenderCard;

            document.getElementById('content').innerHTML = `
        <div class="fc-wrap">
            <div class="fc-hero">
                <h1>Flashcards — ${book.isWeek ? book.name : `${bookId} ${chapter}과`}${week ? ` · ${fcUnitLabel(bookId, false)} ${week}` : ''}</h1>
                <p id="fc-subtitle">${rawWords.length} mots${week ? ` (mots ${weekStartIdx + 1}–${weekStartIdx + rawWords.length})` : ''} · Cliquez sur la carte pour révéler la réponse</p>
            </div>
            <div class="fc-mode-bar">

            <div class="fc-stage">
