<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mew Korean Learning</title>
    <link rel="icon" type="image/png" href="static/images/logo-sk.png">
    <link rel="apple-touch-icon" href="static/images/logo-sk.png">
    <link rel="stylesheet" href="static/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        #lesson-frame {
            width: 100%;
            max-width: 1350px; /* leçon à gauche, espace libre à droite */
            border: none;
            height: 1200px; /* fallback, ajusté au contenu par JS */
            border-radius: var(--radius);
            display: block;
            background: #f4f5f8;
        }

        /* Vue leçon : pleine largeur + vrai scroll de toute la page */
        body.lesson-mode main {
            max-width: 100%;
            padding: 1.25rem 1.75rem 3rem;
        }
        body.lesson-mode .lesson-viewer-bar { max-width: 1350px; }

        /* ---------- LEÇON + PANNEAU EXO (2 colonnes) ---------- */
        .lesson-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 440px;
            gap: 1.25rem;
            align-items: start;
            max-width: 1800px;
        }
        .lesson-layout.no-exos { grid-template-columns: minmax(0, 1350px); }
        .lesson-layout #lesson-frame { max-width: 100%; }

        .exo-side {
            position: sticky;
            top: 1rem;
            max-height: calc(100vh - 2rem);
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .exo-side-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 18px;
            font-weight: 700;
            font-size: .95rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
        }
        .exo-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px;
            overflow-y: auto;
        }

        /* ---------- ONGLETS + CONTENU EXO (partagé lesson/standalone) ---------- */
        .exo-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
        }
        .exo-tab {
            padding: 6px 12px;
            font-size: .82rem;
            font-weight: 600;
            color: var(--text-muted);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 999px;
            cursor: pointer;
            transition: all .15s;
        }
        .exo-tab:hover { color: var(--accent); border-color: var(--accent); }
        .exo-tab.active { color: #fff; background: var(--accent); border-color: var(--accent); }

        .exo-content { overflow-y: auto; padding: 4px 0; }
        .exo-side .exo-content { flex: 1; }
        .exo-render { padding: 6px 18px 22px; font-size: .9rem; line-height: 1.6; }
        .exo-render .exo-h {
            font-size: .82rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .03em;
            color: var(--accent);
            margin: 20px 0 10px;
        }
        .exo-render .exo-h:first-child { margin-top: 4px; }
        .exo-render ol, .exo-render ul { margin: 0 0 8px; padding-left: 1.4em; }
        .exo-render li { margin-bottom: 6px; }
        .exo-render p { margin: 0 0 8px; }
        .exo-render .exo-note {
            font-size: .82rem;
            color: var(--text-muted);
            background: rgba(0, 71, 160, .06);
            border-left: 3px solid var(--accent);
            padding: 8px 12px;
            border-radius: 6px;
            margin: 10px 0;
        }
        /* Mot de vocab survolable dans une phrase d'exo → bulle 한글 */
        .vocab-hint {
            border-bottom: 1px dashed var(--accent);
            cursor: help;
            position: relative;
            font-weight: 600;
        }
        .vocab-tip {
            position: absolute;
            bottom: 135%;
            left: 50%;
            transform: translateX(-50%);
            background: #15171f;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: .9rem;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity .12s ease;
            z-index: 30;
            box-shadow: 0 4px 14px rgba(0,0,0,.22);
        }
        .vocab-tip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #15171f;
        }
        .vocab-hint:hover .vocab-tip,
        .vocab-hint:focus .vocab-tip { opacity: 1; }
        /* Bloc corrections replié */
        .exo-corr {
            margin: 6px 0 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(16, 122, 87, .05);
            overflow: hidden;
        }
        .exo-corr > summary {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 9px 12px;
            font-weight: 700;
            font-size: .82rem;
            color: #0b7a54;
            list-style: none;
            user-select: none;
        }
        .exo-corr > summary::-webkit-details-marker { display: none; }
        .exo-corr[open] > summary { border-bottom: 1px solid var(--border); }
        .exo-corr-body { padding: 8px 14px 4px; }
        .exo-corr-body li { color: #15171f; }

        /* ---------- STANDALONE EXO ---------- */
        .exo-standalone {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            max-width: 900px;
            overflow: hidden;
        }
        .exo-standalone .exo-content { max-height: none; }

        /* ---------- BROWSE EXO (Level > 과 > Exo) ---------- */
        .exo-gwa-block { margin: 0 0 1.25rem; }
        .exo-gwa-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 0 10px;
        }
        .exo-gwa-title { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 1.05rem; }
        .exo-gwa-lesson { font-size: .82rem; color: var(--accent); text-decoration: none; font-weight: 600; }
        .exo-gwa-lesson:hover { text-decoration: underline; }
        .exo-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
        .exo-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            text-decoration: none;
            color: inherit;
            transition: border-color .15s, transform .15s;
        }
        .exo-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .exo-card-num {
            display: grid;
            place-items: center;
            width: 28px; height: 28px;
            flex: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: .85rem;
        }
        .exo-card-title { font-weight: 600; flex: 1; }
        .exo-card-arrow { color: var(--text-muted); }

        @media (max-width: 1100px) {
            .lesson-layout { grid-template-columns: 1fr; }
            .exo-side { position: static; max-height: none; }
            .exo-side .exo-content { max-height: 70vh; }
        }

        /* ---------- CALENDRIER ---------- */
        .cal-hero { margin-bottom: 1.5rem; }
        .cal-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 1.5rem;
            align-items: start;
        }
        .cal-main {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
        }
        .cal-toolbar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .cal-month-title {
            font-size: 1.25rem;
            font-weight: 800;
            min-width: 180px;
        }
        .cal-nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px; height: 34px;
            border-radius: 8px;
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            transition: var(--transition);
        }
        .cal-nav-btn:hover { background: var(--bg); border-color: var(--accent); color: var(--accent); }
        .cal-today-btn {
            margin-left: auto;
            padding: 0.4rem 0.85rem;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .cal-today-btn:hover { filter: brightness(1.08); }
        .cal-grid {
            display: grid;
            grid-template-columns: 46px repeat(7, 1fr);
            gap: 6px;
        }
        .cal-weekdays { margin-bottom: 6px; }
        .cal-wk-head { color: var(--text-muted); }
        .cal-weekcell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-dim);
            border: 1px solid transparent;
            text-decoration: none;
        }
        .cal-weekcell .cal-wk-num { font-size: 0.82rem; }
        .cal-weekcell.has-vocab {
            color: var(--accent);
            border-color: var(--border);
            background: rgba(0,71,160,0.05);
            cursor: pointer;
        }
        .cal-weekcell.has-vocab:hover { border-color: var(--accent); background: rgba(0,71,160,0.12); }
        .cal-weekcell .cal-wk-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

        /* Vocab semaine — cartes */
        .week-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
            margin-top: 1.25rem;
        }
        .week-card {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.1rem 1.2rem;
            text-decoration: none;
            color: var(--text);
            transition: var(--transition);
        }
        .week-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .week-card-range { font-size: 1.05rem; font-weight: 800; }
        .week-card-count { font-size: 0.82rem; color: var(--text-dim); }
        .week-card-actions { margin-top: 0.2rem; }
        .week-card-go { font-size: 0.85rem; font-weight: 700; color: var(--accent); }
        .week-sub { font-size: 0.82rem; color: var(--text-dim); margin-top: 0.25rem; }
        .cal-weekday {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--text-dim);
            padding: 4px 0;
        }
        .cal-cell {
            position: relative;
            min-height: 78px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 8px;
            cursor: pointer;
            transition: var(--transition);
            overflow: hidden;
            background: var(--bg);
        }
        .cal-cell:hover { border-color: var(--accent); }
        .cal-empty { background: transparent; border: none; cursor: default; }
        .cal-daynum { font-size: 0.9rem; font-weight: 600; color: var(--text); }
        .cal-today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
        .cal-today .cal-daynum { color: var(--accent); }
        .cal-selected { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); background: rgba(0,71,160,0.10); }
        .cal-has-note { background: rgba(0,71,160,0.05); }
        .cal-dot {
            position: absolute;
            top: 9px; right: 9px;
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--accent);
        }
        .cal-preview {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 4px;
            font-size: 0.72rem;
            line-height: 1.3;
            color: var(--text-dim);
            white-space: pre-wrap;
            word-break: break-word;
        }
        .cal-editor {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            position: sticky;
            top: 1rem;
        }
        .cal-editor-head {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.85rem;
        }
        .cal-textarea {
            width: 100%;
            min-height: 320px;
            resize: vertical;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
            padding: 0.75rem;
            font-family: inherit;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .cal-textarea:focus { outline: none; border-color: var(--accent); }
        .cal-editor-foot { min-height: 20px; margin-top: 0.5rem; }
        .cal-save-status { font-size: 0.78rem; color: var(--accent); font-weight: 600; }

        @media (max-width: 900px) {
            .cal-layout { grid-template-columns: 1fr; }
            .cal-editor { position: static; }
            .cal-cell { min-height: 58px; }
            .cal-preview { display: none; }
        }

        .lesson-viewer-bar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .lesson-viewer-bar a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .lesson-viewer-bar a:hover {
            text-decoration: underline;
        }

        .lesson-viewer-bar .crumb {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Bouton de téléchargement (leçons + vocab) */
        .dl-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            text-decoration: none;
            transition: background .15s, border-color .15s, color .15s;
        }
        .dl-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .lesson-viewer-bar .dl-btn { margin-left: auto; }

        .vocab-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .vocab-header .dl-btn { flex: none; }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: var(--text-dim);
            font-size: 0.95rem;
            gap: 10px;
        }

        /* Level dot */
        .col-level {
            text-align: center;
            padding: 0 6px !important;
            vertical-align: middle !important;
            cursor: pointer;
            width: 36px;
        }

        .level-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--border);
            transition: all .2s ease;
            cursor: pointer;
        }

        .col-level:hover .level-dot {
            transform: scale(1.4);
            border-color: var(--text-muted);
        }

        tr[data-level="green"] .level-dot {
            background: var(--green);
            border-color: var(--green);
            box-shadow: 0 0 6px var(--green);
        }

        tr[data-level="orange"] .level-dot {
            background: var(--orange);
            border-color: var(--orange);
            box-shadow: 0 0 6px var(--orange);
        }

        tr[data-level="red"] .level-dot {
            background: var(--red);
            border-color: var(--red);
            box-shadow: 0 0 6px var(--red);
        }

        /* Add word btn in chapter sep */
        .chapter-sep-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .add-word-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--accent-dim);
            background: var(--accent-glow);
            color: var(--accent);
            font-size: .78rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .add-word-btn:hover {
            background: var(--accent-dim);
            color: #fff;
            border-color: var(--accent);
        }

        /* Level filter bar */
        .level-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 1rem;
            padding: 12px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        .lvl-filter-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg-card-alt);
            color: var(--text-dim);
            font-size: .82rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .lvl-filter-btn:hover {
            border-color: var(--accent-dim);
            color: var(--text);
        }

        .lvl-filter-btn.active {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        .filter-label {
            display: flex;
            align-items: center;
            font-size: .82rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-right: 2px;
        }

        .fc-level-filter-bar {
            margin: 0 0 4px;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .65);
            backdrop-filter: blur(6px);
            z-index: 400;
        }

        .modal-overlay.open {
            display: block;
        }

        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -52%) scale(.96);
            z-index: 500;
            width: min(540px, 94vw);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
            padding: 1.75rem 2rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease, transform .25s cubic-bezier(.34, 1.56, .64, 1);
        }

        .modal.open {
            opacity: 1;
            pointer-events: all;
            transform: translate(-50%, -50%) scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: .4rem;
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-subtitle {
            font-size: .82rem;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 1.2rem;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card-alt);
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .modal-close:hover {
            border-color: var(--red);
            color: var(--red);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group-full {
            grid-column: 1/-1;
        }

        .form-label {
            font-size: .78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text-dim);
        }

        .form-label .req {
            color: var(--red);
        }

        .form-input {
            padding: 10px 14px;
            background: var(--bg-card-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            color: var(--text);
            font-size: .9rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-textarea {
            resize: vertical;
            min-height: 68px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 22px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: .9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary:hover {
            opacity: .88;
        }

        .btn-primary:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .btn-secondary {
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-card-alt);
            color: var(--text-dim);
            font-size: .9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-secondary:hover {
            border-color: var(--text-dim);
            color: var(--text);
        }

        .modal-success {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            background: rgba(22, 163, 74, .1);
            border: 1px solid rgba(22, 163, 74, .3);
            color: var(--green);

    <script>
        // ================================================================
        // DATA (inlined from manifest.json — auto-updated by LLM)
        // ================================================================
        let MANIFEST = null;
        const bookCache = {};

        // ================================================================
        // CSV PARSER
        // ================================================================
        function parseCSV(text) {
            const rows = [];
            let row = [], field = '', inQ = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (inQ) {
                    if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
                    else field += ch;
                } else {
                    if (ch === '"') inQ = true;
                    else if (ch === ',') { row.push(field); field = ''; }
                    else if (ch === '\n' || ch === '\r') {
                        if (ch === '\r' && text[i + 1] === '\n') i++;
                        row.push(field); field = '';
                        if (row.some(f => f)) rows.push(row);
                        row = [];
                    } else field += ch;
                }
            }
            if (field || row.length) { row.push(field); if (row.some(f => f)) rows.push(row); }
            return rows;
        }

        function parseVocabCSV(text, bookId) {
            const rows = parseCSV(text);
            const chapters = {};
            let cur = 0;
            let total = 0;
            for (let i = 1; i < rows.length; i++) {
                const [h = '', fr = '', ex = '', tr = '', expl = ''] = rows[i].map(s => s.trim());
                if (h && /^\d+과$/.test(h) && !fr) {
                    cur = parseInt(h);
                    if (!chapters[cur]) chapters[cur] = [];
                    continue;
                }
                if (!h && !fr) continue;
                if (!chapters[cur]) chapters[cur] = [];
                chapters[cur].push({ hangul: h, french: fr, example: ex, translated: tr, explanation: expl });
                total++;
            }
            return { id: bookId, name: `Vocab ${bookId}`, chapters, total };
        }

        async function fetchBook(bookId) {
            if (bookCache[bookId]) return bookCache[bookId];
            // Livre-semaine synthétique : id "W<date>" → CSV plat dans content/weekly/
            if (bookId && bookId[0] === 'W') {
                const w = weekById(bookId.slice(1));
                if (w) {
                    const res = await fetch(`content/weekly/${w.file}`);
                    const words = parseFlatVocabCSV(await res.text());
                    bookCache[bookId] = { id: bookId, name: weekLabel(w), chapters: { 1: words }, total: words.length, isWeek: true, week: w };
                    return bookCache[bookId];
                }
            }
            const res = await fetch(`content/vocab/Vocab ${bookId}.csv`);
            const text = await res.text();
            bookCache[bookId] = parseVocabCSV(text, bookId);
            return bookCache[bookId];
        }

        // ================================================================
        // WEEKLY VOCAB (vocab annexe, hors leçon) — helpers
        // ================================================================
        // Un livre-semaine réutilise tout le moteur vocab/flashcard/test via
        // l'id synthétique "W<date>" (chapitre unique = 1).
        function getWeeks() { return (MANIFEST.weeks || []).slice().sort((a, b) => (a.start < b.start ? 1 : -1)); }
        function weekById(id) { return (MANIFEST.weeks || []).find(w => w.id === id) || null; }
        function weekBookId(id) { return 'W' + id; }

        // "29 juin → 5 juil. 2026"
        function weekLabel(w) {
            const shortMon = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
            const [ys, ms, ds] = w.start.split('-').map(Number);
            const [ye, me, de] = w.end.split('-').map(Number);
            const s = `${ds} ${shortMon[ms - 1]}`;
            const e = `${de} ${shortMon[me - 1]} ${ye}`;
            return `${s} → ${e}`;
        }

        // CSV plat (header optionnel, pas de séparateur "N과") → liste de mots
        function parseFlatVocabCSV(text) {
            const rows = parseCSV(text);
            const out = [];
            for (let i = 0; i < rows.length; i++) {
                const [h = '', fr = '', ex = '', tr = '', expl = ''] = rows[i].map(s => s.trim());
                if (i === 0 && (h === '한글' || h.toLowerCase() === 'hangul')) continue; // header
                if (!h && !fr) continue;
                out.push({ hangul: h, french: fr, example: ex, translated: tr, explanation: expl });
            }
            return out;
        }

        // Télécharge une semaine = CSV plat (header + mots, + custom éventuels).
        function downloadWeek(bookId) {
            const book = bookCache[bookId];
            if (!book) return;
            const custom = getCustomWords(bookId);
            const words = [...(book.chapters[1] || []), ...(custom[1] || [])];
            const lines = [VOCAB_CSV_HEADER.join(',')];
            for (const w of words) lines.push(wordRowCSV(w));
            triggerDownload(`Vocab semaine ${book.week.start}.csv`, lines.join('\r\n'), 'text/csv');
        }

        // ================================================================
        // DOWNLOAD HELPERS
        // ================================================================
        function triggerDownload(filename, content, mime) {
            // BOM en tête → Excel ouvre correctement l'UTF-8 (한글)
            const blob = new Blob(['﻿', content], { type: `${mime};charset=utf-8` });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function csvEscape(v) {
            v = (v == null ? '' : String(v));
            return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
        }

        const VOCAB_CSV_HEADER = ['한글', 'French', 'Example Sentence', 'Translated Sentence', 'Explanation'];

        function wordRowCSV(w) {
            return [w.hangul, w.french, w.example, w.translated, w.explanation].map(csvEscape).join(',');
        }

        // Télécharge le vocab : un chapitre précis (chapter = n) ou tout le livre (chapter = null),
        // en reproduisant le format source (lignes séparatrices "N과").
        function downloadVocab(bookId, chapter) {
            const book = bookCache[bookId];
            if (!book) return;
            const custom = getCustomWords(bookId);
            const lines = [VOCAB_CSV_HEADER.join(',')];
            const chapNums = chapter != null
                ? [chapter]
                : Object.keys(book.chapters).map(Number).sort((a, b) => a - b);
            for (const n of chapNums) {
                lines.push(`${csvEscape(`${n}과`)},,,,`);
                const words = [...(book.chapters[n] || []), ...(custom[n] || [])];
                for (const w of words) lines.push(wordRowCSV(w));
            }
            const name = chapter != null ? `Vocab ${bookId} - ${chapter}과.csv` : `Vocab ${bookId}.csv`;
            triggerDownload(name, lines.join('\r\n'), 'text/csv');
        }

        // Télécharge une leçon = son fichier HTML source, tel quel (self-contained).
        async function downloadLesson(level, filename) {
            const decodedFile = decodeURIComponent(filename);
            try {
                const res = await fetch(`content/lessons/${level}/${decodedFile}`);
                if (!res.ok) throw new Error(res.status);
                triggerDownload(decodedFile, await res.text(), 'text/html');
            } catch (e) {
                alert(`Téléchargement impossible : ${e.message}`);
            }
        }

        // ================================================================
        // EXO — exercices de traduction (markdown → panneau)
        // ================================================================
        const exoMdCache = {};

        // Liste des fichiers exo d'un 과 depuis le manifest (ex: "4A", "1")
        function getExoList(level, gwa) {
            return (MANIFEST.exos && MANIFEST.exos[level] && MANIFEST.exos[level][String(gwa)]) || [];
        }

        async function fetchExoMd(level, gwa, filename) {
            const key = `${level}/${gwa}/${filename}`;
            if (exoMdCache[key]) return exoMdCache[key];
            const res = await fetch(`content/exos/${level}/${gwa}과/${encodeURIComponent(filename)}`);
            if (!res.ok) throw new Error(res.status);
            const md = await res.text();
            exoMdCache[key] = md;
            return md;
        }

        // --- mini markdown (sous-ensemble utilisé par les exos) ---
        function exoInline(s) {
            return s
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                // Mot de vocab : [[français|한글]] → survol = bulle avec la trad coréenne
                .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,
                    '<span class="vocab-hint" tabindex="0">$1<span class="vocab-tip">$2</span></span>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>');
        }

        // Rend un bloc de lignes (listes ordonnées/à puces, paragraphes, notes)
        function exoBlock(lines) {
            let out = '', listType = null, buf = [];
            const flush = () => {
                if (listType) out += `<${listType}>` + buf.map(x => `<li>${exoInline(x)}</li>`).join('') + `</${listType}>`;
                buf = []; listType = null;
            };
            for (const l of lines) {
                if (!l) { flush(); continue; }
                const ol = l.match(/^\d+\.\s+(.*)/);
                const ul = l.match(/^-\s+(.*)/);
                if (ol) { if (listType && listType !== 'ol') flush(); listType = 'ol'; buf.push(ol[1]); }
                else if (ul) { if (listType && listType !== 'ul') flush(); listType = 'ul'; buf.push(ul[1]); }
                else {
                    flush();
                    const note = l.match(/^\*(.+)\*$/);
                    out += note ? `<p class="exo-note">${exoInline(note[1])}</p>` : `<p>${exoInline(l)}</p>`;
                }
            }
            flush();
            return out;
        }

        // Convertit le markdown d'un exo en HTML : les blocs "Correction(s)" sont
        // repliés dans un <details> (on traduit d'abord, on vérifie ensuite).
        function parseExoMarkdown(md) {
            const sections = [];
            let cur = null;
            for (const raw of md.split(/\r?\n/)) {
                const t = raw.trim();
                if (t.startsWith('# ')) continue; // titre du doc, ignoré
                const hdr = t.match(/^\*\*(.+?)\*\*$/);
                if (hdr) { cur = { header: hdr[1], isCorr: /correction/i.test(hdr[1]), body: [] }; sections.push(cur); continue; }
                if (!cur) { cur = { header: null, isCorr: false, body: [] }; sections.push(cur); }
                cur.body.push(t);
            }
            return sections.map(s => {
                const body = exoBlock(s.body);
                if (s.header == null) return body;
                if (s.isCorr) return `<details class="exo-corr"><summary><i data-lucide="eye" class="icon-xs"></i> ${exoInline(s.header)}</summary><div class="exo-corr-body">${body}</div></details>`;
                return `<h4 class="exo-h">${exoInline(s.header)}</h4>${body}`;
            }).join('');
        }

        // Panneau leçon : simple liste de liens vers chaque page d'exo (Exo 1..N)
        function exoLinksList(level, gwa) {
            const list = getExoList(level, gwa);
            if (!list.length) return `<div class="empty-state" style="padding:18px">Aucun exercice pour ce 과.</div>`;
            return `<div class="exo-links">${list.map((f, i) =>
                `<a href="#exo/${level}/${gwa}/${i}" class="exo-card">
                    <span class="exo-card-num">${i + 1}</span>
                    <span class="exo-card-title">${f.replace('.md', '')}</span>
                    <span class="exo-card-arrow">→</span>
                </a>`).join('')}</div>`;
        }

        // Coquille du panneau exo : barre d'onglets + zone de contenu
        function exoPanelShell(level, gwa, barId, bodyId) {
            const list = getExoList(level, gwa);
            if (!list.length) return `<div class="empty-state">Aucun exercice pour ce 과 pour l'instant.</div>`;
            const tabs = list.map((f, i) =>
                `<button class="exo-tab${i === 0 ? ' active' : ''}" onclick="exoSelectTab('${barId}','${bodyId}','${level}','${gwa}',${i})">${f.replace('.md', '')}</button>`
            ).join('');
            return `<div class="exo-tabs" id="${barId}">${tabs}</div><div class="exo-content" id="${bodyId}"></div>`;
        }

        function exoSelectTab(barId, bodyId, level, gwa, index) {
            document.querySelectorAll(`#${barId} .exo-tab`).forEach((t, i) => t.classList.toggle('active', i === index));
            loadExoInto(bodyId, level, gwa, index);
        }

        async function loadExoInto(bodyId, level, gwa, index) {
            const body = document.getElementById(bodyId);
            if (!body) return;
            const list = getExoList(level, gwa);
            const filename = list[index];
            if (!filename) { body.innerHTML = `<div class="empty-state">Aucun exercice.</div>`; return; }
            body.innerHTML = `<div class="loading">Chargement…</div>`;
            try {
                const md = await fetchExoMd(level, gwa, filename);
                body.innerHTML = `<div class="exo-render">${parseExoMarkdown(md)}</div>`;
                lucide.createIcons();
            } catch (e) {
                body.innerHTML = `<div class="empty-state">Erreur de chargement : ${e.message}</div>`;
            }
        }

        async function downloadExo(level, gwa, index) {
            const list = getExoList(level, gwa);
            const filename = list[index];
            if (!filename) return;
            try {
                const md = await fetchExoMd(level, gwa, filename);
                triggerDownload(`${level} ${gwa}과 - ${filename}`, md, 'text/markdown');
            } catch (e) { alert(`Téléchargement impossible : ${e.message}`); }
        }

        // Page de navigation Exo : Level > 과 > Exo 1..N (une seule page, pas de sous-menu sidebar)
        function renderExos(filterLevel) {
            document.getElementById('sidebar-extra').innerHTML = '';
            const all = MANIFEST.exos || {};
            const levels = filterLevel ? Object.keys(all).filter(l => l === filterLevel) : Object.keys(all);

            const levelsHTML = levels.map(lvl => {
                const cls = lvl.startsWith('3') ? 'l3' : 'l4';
                const gwaNums = Object.keys(all[lvl]).sort((a, b) => parseInt(a) - parseInt(b));
                const gwaHTML = gwaNums.map(gwa => {
                    const exos = all[lvl][gwa];
                    const cards = exos.map((f, i) => {
                        const label = f.replace('.md', '');
                        return `<a href="#exo/${lvl}/${gwa}/${i}" class="exo-card">
                            <span class="exo-card-num">${i + 1}</span>
                            <span class="exo-card-title">${label}</span>
                            <span class="exo-card-arrow">→</span>
                        </a>`;
                    }).join('');
                    const lessonFile = encodeURIComponent(`${lvl} 과${gwa}.html`);
                    return `<div class="exo-gwa-block">
                        <div class="exo-gwa-head">
                            <span class="exo-gwa-title"><i data-lucide="book-open" class="icon-sm"></i> ${gwa}과</span>
                            <a href="#lesson/${lvl}/${lessonFile}" class="exo-gwa-lesson">Voir avec la leçon →</a>
                        </div>
                        <div class="exo-cards">${cards}</div>
                    </div>`;
                }).join('');
                return `<div class="level-group">
                    <div class="level-group-header">
                        <div class="level-group-icon ${cls}"><i data-lucide="folder"></i></div>
                        <span class="level-group-title">Level ${lvl}</span>
                        <span class="level-group-badge ${cls}">${gwaNums.length} 과</span>
                    </div>
                    ${gwaHTML}
                </div>`;
            }).join('') || `<div class="empty-state">Aucun exercice pour l'instant.</div>`;

            document.getElementById('content').innerHTML = `
        <div class="hero">
            <h1><span class="kr">연습</span> Exercices</h1>
            <p class="subtitle">Traduction FR → coréen, par 과</p>
        </div>
        ${levelsHTML}
    `;
            lucide.createIcons();
        }

        // Vue standalone d'un exo (avec onglets frères + lien vers la leçon)
        function renderExoStandalone(level, gwa, index) {
            document.getElementById('sidebar-extra').innerHTML = '';
            const lessonFile = encodeURIComponent(`${level} 과${gwa}.html`);
            document.getElementById('content').innerHTML = `
        <div class="lesson-viewer-bar">
            <a href="#exos">← Retour aux exos</a>
            <span class="crumb">/ Level ${level} / ${gwa}과</span>
            <a href="#lesson/${level}/${lessonFile}" class="dl-btn" style="margin-left:auto"><i data-lucide="book-open" class="icon-xs"></i> Ouvrir la leçon</a>
            <button class="dl-btn" onclick="downloadExo('${level}','${gwa}', document.querySelector('#exo-bar-std .exo-tab.active').dataset.idx|0)"><i data-lucide="download" class="icon-xs"></i> Télécharger</button>
        </div>
        <div class="exo-standalone">
            ${exoPanelShell(level, gwa, 'exo-bar-std', 'exo-body-std')}
        </div>
    `;
            lucide.createIcons();
            // marque l'index sur chaque onglet (pour le bouton télécharger) + active le bon
            document.querySelectorAll('#exo-bar-std .exo-tab').forEach((t, i) => { t.dataset.idx = i; });
            exoSelectTab('exo-bar-std', 'exo-body-std', level, gwa, index || 0);
        }

        // ================================================================
        // ROUTING
        // ================================================================
        function getRoute() {
            const h = decodeURIComponent(location.hash || '#');
            const parts = h.slice(1).split('/').filter(Boolean);
            return { page: parts[0] || '', args: parts.slice(1) };
        }

        window.addEventListener('hashchange', route);
        window.addEventListener('load', async () => {
            const res = await fetch('content/manifest.json');
            MANIFEST = await res.json();
            route();
        });

        async function route() {
            const { page, args } = getRoute();
            setNavActive(page);
            document.body.classList.toggle('lesson-mode', page === 'lesson' || page === 'exo');
            const el = document.getElementById('content');
            el.innerHTML = '<div class="loading">Chargement…</div>';
            lucide.createIcons();

            if (!page || page === '') { await renderHome(); }
            else if (page === 'weekly') { await renderWeekList(); }
            else if (page === 'vocab') { await renderVocab(args[0], args[1] ? parseInt(args[1]) : null); }
            else if (page === 'lessons') { renderLessons(args[0] || null); }
            else if (page === 'lesson') { renderLesson(args[0], args.slice(1).join('/')); }
            else if (page === 'exos') { renderExos(args[0] || null); }
            else if (page === 'exo') { renderExoStandalone(args[0], args[1], args[2] ? parseInt(args[2]) : 0); }
            else if (page === 'flashcard') { await renderFlashcard(args[0] || null, args[1] ? parseInt(args[1]) : null, args[2] ? parseInt(args[2]) : null); }
            else if (page === 'test') { await renderTest(args[0] || null, args[1] ? parseInt(args[1]) : null); }
            else if (page === 'youtube') { await renderYoutube(); }
            else if (page === 'calendar') { renderCalendar(args[0] || null); }
        }

        function setNavActive(page) {
            const { args } = getRoute();
            const weekCtx = page === 'weekly' || ((page === 'vocab' || page === 'flashcard' || page === 'test') && (args[0] || '')[0] === 'W');
            document.getElementById('nav-weekly').classList.toggle('active', weekCtx);
            document.getElementById('nav-vocab').classList.toggle('active', !page || page === '' || (page === 'vocab' && !weekCtx));
            document.getElementById('nav-lessons').classList.toggle('active', page === 'lessons' || page === 'lesson');
            document.getElementById('nav-exos').classList.toggle('active', page === 'exos' || page === 'exo');
            document.getElementById('nav-flashcard').classList.toggle('active', page === 'flashcard' && !weekCtx);
            document.getElementById('nav-test').classList.toggle('active', page === 'test' && !weekCtx);
            document.getElementById('nav-youtube').classList.toggle('active', page === 'youtube');
            document.getElementById('nav-calendar').classList.toggle('active', page === 'calendar');
        }

        function getLvlStore(bookId) { try { return JSON.parse(localStorage.getItem(`mew_lvl_${bookId}`) || '{}'); } catch { return {}; } }
        function saveLvlStore(bookId, data) {
            localStorage.setItem(`mew_lvl_${bookId}`, JSON.stringify(data));
            // Persiste côté serveur (fichier JSON partagé) pour que le niveau
            // soit le même sur tous les appareils, sans compte ni session.
            fetch(`api/levels.php?book=${encodeURIComponent(bookId)}`, {
                method: 'POST',

            }).catch(() => { });

        // Récupère la copie serveur et l'utilise comme cache local avant de rendre
        // la page, pour refléter les changements faits depuis un autre appareil.
        async function syncLvlStore(bookId) {
            try {
                const res = await fetch(`api/levels.php?book=${encodeURIComponent(bookId)}`);
                if (!res.ok) return;
                const remote = await res.json();
                if (remote && typeof remote === 'object' && !Array.isArray(remote)) {
                    localStorage.setItem(`mew_lvl_${bookId}`, JSON.stringify(remote));
                }
            } catch (e) { /* hors-ligne ou API indisponible — on garde le cache local */ }
        }

        // ================================================================
        // CALENDRIER — notes quotidiennes (localStorage)
        // ================================================================
        const MONTHS_FR = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
            'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
        const DAYS_FR = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];

        function getCalNotes() { try { return JSON.parse(localStorage.getItem('mew_calendar') || '{}'); } catch { return {}; } }
        function saveCalNotes(d) { localStorage.setItem('mew_calendar', JSON.stringify(d)); }
        const calKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        // Numéro de semaine ISO 8601
        function isoWeek(d) {
            const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const day = (t.getUTCDay() + 6) % 7;      // lundi = 0
            t.setUTCDate(t.getUTCDate() - day + 3);    // jeudi de la semaine
            const firstThu = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
            const firstDay = (firstThu.getUTCDay() + 6) % 7;
            firstThu.setUTCDate(firstThu.getUTCDate() - firstDay + 3);
            return 1 + Math.round((t - firstThu) / (7 * 24 * 3600 * 1000));
        }

        let _calMonth = null;    // Date sur le 1er du mois affiché
        let _calSelected = null; // clé YYYY-MM-DD du jour sélectionné

        function renderCalendar(ym) {
            document.getElementById('sidebar-extra').innerHTML = '';
            const today = new Date();
            if (ym && /^\d{4}-\d{2}$/.test(ym)) {
                const [y, m] = ym.split('-').map(Number);
                _calMonth = new Date(y, m - 1, 1);
            } else if (!_calMonth) {
                _calMonth = new Date(today.getFullYear(), today.getMonth(), 1);
            }
            if (!_calSelected) _calSelected = calKey(today);

            const year = _calMonth.getFullYear();
            const month = _calMonth.getMonth();
            const notes = getCalNotes();
            const todayKey = calKey(today);

            const first = new Date(year, month, 1);
            const offset = (first.getDay() + 6) % 7; // lundi = 0
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const prev = `${month === 0 ? year - 1 : year}-${String(month === 0 ? 12 : month).padStart(2, '0')}`;
            const next = `${month === 11 ? year + 1 : year}-${String(month === 11 ? 1 : month + 2).padStart(2, '0')}`;

            const slots = offset + daysInMonth;
            const rows = Math.ceil(slots / 7);
            let cells = '';
            for (let r = 0; r < rows; r++) {
                // Lundi de la ligne → sert de clé de semaine (ids de semaines = lundis)
                const monday = new Date(year, month, 1 - offset + r * 7);
                const wKey = calKey(monday);
                const wk = weekById(wKey);
                if (wk) {
                    cells += `<a class="cal-weekcell has-vocab" href="#vocab/${weekBookId(wk.id)}/1" title="Vocab semaine — ${weekLabel(wk)}">
                        <span class="cal-wk-num">S${isoWeek(monday)}</span><span class="cal-wk-dot"></span>
                    </a>`;
                } else {
                    cells += `<div class="cal-weekcell"><span class="cal-wk-num">S${isoWeek(monday)}</span></div>`;
                }
                for (let s = 0; s < 7; s++) {
                    const d = r * 7 + s - offset + 1;
                    if (d < 1 || d > daysInMonth) { cells += `<div class="cal-cell cal-empty"></div>`; continue; }
                    const dd = new Date(year, month, d);
                    const key = calKey(dd);
                    const note = notes[key];
                    const cls = ['cal-cell'];
                    if (key === todayKey) cls.push('cal-today');
                    if (key === _calSelected) cls.push('cal-selected');
                    if (note && note.trim()) cls.push('cal-has-note');
                    cells += `<div class="${cls.join(' ')}" data-key="${key}" onclick="selectCalDay('${key}')">
                        <span class="cal-daynum">${d}</span>
                        ${note && note.trim() ? `<span class="cal-dot"></span><span class="cal-preview">${escapeHtml(note.trim())}</span>` : ''}
                    </div>`;
                }
            }

            document.getElementById('content').innerHTML = `
        <div class="hero cal-hero">
            <h1><span class="kr">달력</span> Calendrier</h1>
            <p class="subtitle">Note ce que tu veux, jour par jour.</p>

        <div class="cal-layout">
            <div class="cal-main">
                <div class="cal-toolbar">
                    <a class="cal-nav-btn" href="#calendar/${prev}"><i data-lucide="chevron-left" class="icon-sm"></i></a>

                    <a class="cal-nav-btn" href="#calendar/${next}"><i data-lucide="chevron-right" class="icon-sm"></i></a>
                    <a class="cal-today-btn" href="#calendar/${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}" onclick="_calSelected='${todayKey}'">Aujourd'hui</a>

                <div class="cal-grid cal-days">${cells}</div>
            </div>
            <div class="cal-editor" id="cal-editor"></div>
        </div>
    `;

        let _calSaveTimer = null;
        function onCalInput(val) {
            const notes = getCalNotes();
            if (val.trim()) notes[_calSelected] = val; else delete notes[_calSelected];
            saveCalNotes(notes);
            // Met à jour la cellule (dot + aperçu) en direct.

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // ================================================================
        // FLASHCARD
        // ================================================================
        let _fc = {};  // flashcard state

        // 4A/4B : vocab découpé en 7 lots égaux (1 par jour du cycle leçon J1-J7).
        // 3A/3B (déjà vus) : legacy, lots fixes de 10 mots ("semaines").
        const FC_DAILY_BOOKS = ['4A', '4B'];
        function fcIsDaily(bookId) { return FC_DAILY_BOOKS.includes(bookId); }
        function fcGroups(words, bookId) {
            if (!fcIsDaily(bookId)) {
                const groups = [];
                for (let i = 0; i < words.length; i += 10) groups.push(words.slice(i, i + 10));
                return groups;
            }
            const n = 7, len = words.length, base = Math.floor(len / n), rem = len % n;
            const groups = []; let idx = 0;
            for (let i = 0; i < n; i++) {
                const size = base + (i >= n - rem ? 1 : 0);
                groups.push(words.slice(idx, idx + size));
                idx += size;

        function fcWordLevel(w) { return getLvlStore(_fc.bookId)[`${_fc.chapter}_${w.hangul}`] || 'none'; }
        function fcFilteredWords() { return _fc.rawWords.filter(w => _fc.levelFilter[fcWordLevel(w)]); }

        window.fcSetMode = function (mode) {

        async function renderTest(bookId, chapter) {
            const books = MANIFEST.books;
            if (!bookId) {

                document.getElementById('content').innerHTML = `

                lucide.createIcons(); return;

            const book = await fetchBook(bookId);
            const chNums = Object.keys(book.chapters).map(Number).sort((a, b) => a - b);
            if (chapter === null) {
                document.getElementById('sidebar-extra').innerHTML = '';
                document.getElementById('content').innerHTML = `
            <div class="test-wrap">
                <div class="test-hero"><h1>Test — ${book.isWeek ? book.name : bookId}</h1><p>Choisissez un chapitre :</p></div>
                <div class="chapter-nav" style="margin-top:16px">

                </div>
            </div>`;
                lucide.createIcons(); return;
            }

            document.getElementById('sidebar-extra').innerHTML = `
        <div class="nav-section-label">Livres</div>
        ${books.map(b => `<a href="#test/${b}" class="sidebar-link ${b === bookId ? 'active' : ''}">
            <span class="sidebar-icon"><i data-lucide="book-open" class="icon-sm"></i></span>
            <span>${b}</span></a>`).join('')}
        <div class="nav-section-label">Chapitres</div>
        <div class="sidebar-sub">
            ${chNums.map(n => `<a href="#test/${bookId}/${n}" class="sidebar-link ${n === chapter ? 'active' : ''}">

        </div>`;

            function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }

            _test = {
                bookId, chapter,
                words: shuffle([...(book.chapters[chapter] || [])]),
                idx: 0, score: 0,
                wrongs: [],   // [{word, dir, given}]
                answered: false,
            };

            function getDir(idx) { return idx % 2 === 0 ? 'kr' : 'fr'; }

            function stripAccents(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, ''); }
            function normalise(s) {
                s = stripAccents(String(s).toLowerCase());
                s = s.replace(/\([^)]*\)/g, ' ');                 // retire les clarifications entre parenthèses
                s = s.replace(/['’.!?;:«»"]/g, ' ');               // ponctuation / apostrophes -> espace
                s = s.replace(/[-–]/g, ' ');
                s = s.replace(/\b(le|la|les|l|un|une|des|du|de|d|au|aux|a|à|en|the)\b/g, ' '); // articles / prépositions
                s = s.replace(/\s+/g, ' ').trim();
                return s;
            }
            function levenshtein(a, b) {
                const m = a.length, n = b.length;
                if (!m) return n; if (!n) return m;
                let prev = Array.from({ length: n + 1 }, (_, j) => j);
                for (let i = 1; i <= m; i++) {
                    const cur = [i];
                    for (let j = 1; j <= n; j++) {
                        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
                    }
                    prev = cur;
                }
                return prev[n];
            }

            function checkAnswer(word, dir, given) {
                const correct = dir === 'kr' ? word.french : word.hangul;
                const gn = normalise(given);
                if (!gn) return false;
                const isFrench = dir === 'kr';                     // on tape du français quand le coréen est montré
                // Plusieurs traductions acceptées séparées par , ou /
                const segments = correct.split(/[,/،;]/).map(normalise).filter(Boolean);
                const gnNS = gn.replace(/\s+/g, '');
                return segments.some(seg => {
                    if (gn === seg) return true;
                    if (gnNS === seg.replace(/\s+/g, '')) return true;          // tolère les espaces (utile en coréen)
                    if (isFrench && seg.length >= 5 && levenshtein(gn, seg) <= 1) return true; // 1 faute de frappe en français
                    return false;
                });
            }

            function renderQuestion() {
                if (_test.idx >= _test.words.length) { renderResults(); return; }
                const w = _test.words[_test.idx];
                const dir = getDir(_test.idx);
                const shown = dir === 'kr' ? w.hangul : w.french;
                const dirLabel = dir === 'kr' ? 'Donnez la traduction en français' : 'Donnez la traduction en coréen (한글)';

                document.getElementById('content').innerHTML = `

                    <input class="test-input" id="test-inp" type="text" placeholder="${ph}" autocomplete="off" autocorrect="off">
                    <button class="test-submit-btn" id="test-submit-btn" onclick="testSubmit()">Valider</button>
                </div>
                <div class="test-feedback" id="test-feedback"></div>
                <button class="test-next-btn" id="test-next-btn" onclick="testNext()">Question suivante →</button>
            </div>`;
                lucide.createIcons();
                _test.answered = false;
                const inp = document.getElementById('test-inp');
                inp.focus();
                inp.addEventListener('keydown', e => { if (e.key === 'Enter') { if (!_test.answered) testSubmit(); else testNext(); } });
            }

            window.testSubmit = function () {
                if (_test.answered) return;
                const given = document.getElementById('test-inp')?.value?.trim() || '';
                if (!given) return;
                const w = _test.words[_test.idx];
                const dir = getDir(_test.idx);
                const correct = dir === 'kr' ? w.french : w.hangul;
                const ok = checkAnswer(w, dir, given);
                if (ok) _test.score++;
                else _test.wrongs.push({ word: w, dir, given });
                _test.answered = true;

                const inp = document.getElementById('test-inp');
                const fb = document.getElementById('test-feedback');
                const nb = document.getElementById('test-next-btn');
                const sb = document.getElementById('test-submit-btn');
                inp.classList.add(ok ? 'correct' : 'wrong');
                inp.disabled = true;
                sb.disabled = true;
                fb.className = 'test-feedback show ' + (ok ? 'ok' : 'ko');
                fb.textContent = ok ? `Correct ! — Réponse : ${correct}` : `Incorrect — Réponse : ${correct}`;
                nb.classList.add('show');
                nb.textContent = _test.idx === _test.words.length - 1 ? 'Voir les résultats →' : 'Question suivante →';
            };

            window.testNext = function () { _test.idx++; renderQuestion(); };

            function renderResults() {
                const total = _test.words.length;
                const pct = Math.round((_test.score / total) * 100);
                const wrongsHTML = _test.wrongs.length ? `
            <div class="test-wrong-list">
                <h3 style="margin-bottom:12px;font-size:1rem;color:var(--text-muted)">À retravailler (${_test.wrongs.length}) :</h3>
                ${_test.wrongs.map(e => {
                    const shown = e.dir === 'kr' ? e.word.hangul : e.word.french;
                    const ans = e.dir === 'kr' ? e.word.french : e.word.hangul;
                    return `<div class="test-wrong-item">
                        <span class="test-wrong-kr">${shown}</span>
                        <span class="test-wrong-arrow">→</span>
                        <span class="test-wrong-fr">${ans}</span>
                        <span class="test-wrong-your">Votre réponse : "${e.given}"</span>
                    </div>`;
                }).join('')}
            </div>` : `<p style="color:var(--green);font-weight:600;margin-top:12px;">Aucune erreur — parfait !</p>`;

                document.getElementById('content').innerHTML = `
            <div class="test-wrap">
                <div class="test-results">
                    <h2>Résultats — ${bookId} ${chapter}과</h2>
                    <div class="test-score-display">${_test.score} / ${total} <span style="font-size:.5em;color:var(--text-muted)">(${pct}%)</span></div>
                    ${wrongsHTML}
                    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;">
                        <button class="fc-btn primary" onclick="testRestart()">Recommencer</button>
                        <a href="#flashcard/${bookId}/${chapter}" class="practice-btn" style="padding:9px 18px;">Retour aux flashcards</a>
                        <a href="#vocab/${bookId}/${chapter}" class="practice-btn test-btn" style="padding:9px 18px;">Voir le vocab</a>
                    </div>
                </div>
            </div>`;
                lucide.createIcons();
            }

            window.testRestart = function () { renderTest(_test.bookId, _test.chapter); };

            renderQuestion();
        }

        // ================================================================
        // YOUTUBE FEED
        // ================================================================
        async function renderYoutube() {
            document.getElementById('sidebar-extra').innerHTML = '';
            let channels;
            try {
                const res = await fetch('api/youtube-feed.php');
                channels = await res.json();
            } catch (e) {
                document.getElementById('content').innerHTML = `
            <div class="hero"><h1>Vidéos</h1></div>
            <p style="color:var(--text-dim)">Impossible de charger le feed YouTube pour le moment.</p>`;
                return;
            }

            document.getElementById('content').innerHTML = `
        <div class="hero">
            <h1>Vidéos</h1>
            <p class="subtitle">Dernières vidéos des chaînes coréennes suivies</p>
        </div>
        <div class="chapter-nav" id="yt-filter">
            <a href="#" class="ch-pill active" data-channel="all" onclick="ytFilter(event,'all')">Toutes</a>
            ${channels.map(c => `<a href="#" class="ch-pill" data-channel="${c.channelId}" onclick="ytFilter(event,'${c.channelId}')">${escapeHtml(c.channelName)} <span class="count">${c.videos.length}</span></a>`).join('')}
        </div>
        ${channels.map(renderYtChannelSection).join('')}
    `;
            lucide.createIcons();
        }

        function renderYtChannelSection(c) {
            const main = c.videos.slice(0, 10);
            const extra = c.videos.slice(10);
            return `
        <div class="yt-channel-section" data-channel="${c.channelId}">
            <h2 class="yt-channel-title">${escapeHtml(c.channelName)}</h2>
            <div class="yt-grid">
                ${main.map(v => ytCard(v, c.channelName)).join('')}
                ${extra.map(v => `<div class="yt-extra">${ytCard(v, c.channelName)}</div>`).join('')}
            </div>
            ${extra.length ? `<button class="toggle-btn yt-more-btn" onclick="ytToggleMore(this)">Voir ${extra.length} de plus</button>` : ''}
        </div>`;
        }

        function ytCard(v, channelName) {
            const date = new Date(v.published);
            const dateStr = isNaN(date) ? '' : date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
            return `<div class="yt-card">
        <div class="yt-thumb-wrap" onclick="ytPlay(this,'${v.videoId}')">
            <img src="${v.thumbnail}" alt="" class="yt-thumb" loading="lazy">
            <div class="yt-play-btn"><i data-lucide="play-circle"></i></div>
        </div>
        <div class="yt-info">
            <div class="yt-title">${escapeHtml(v.title)}</div>
            <div class="yt-meta">${escapeHtml(channelName)} · ${dateStr}</div>
        </div>
    </div>`;
        }

        function ytPlay(el, videoId) {
            el.outerHTML = `<div class="yt-thumb-wrap yt-embed-wrap">
        <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>`;
        }

        function ytFilter(e, channelId) {
            e.preventDefault();
            document.querySelectorAll('#yt-filter .ch-pill').forEach(p => p.classList.toggle('active', p.dataset.channel === channelId));
            document.querySelectorAll('.yt-channel-section').forEach(s => {
                s.style.display = (channelId === 'all' || s.dataset.channel === channelId) ? '' : 'none';
            });
        }

        function ytToggleMore(btn) {
            const section = btn.closest('.yt-channel-section');
            const extras = section.querySelectorAll('.yt-extra');
            const showing = !extras[0].classList.contains('show');
            extras.forEach(el => el.classList.toggle('show', showing));
            btn.textContent = showing ? 'Voir moins' : `Voir ${extras.length} de plus`;
        }

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s ?? '';
            return div.innerHTML;
        }

        // ================================================================
        // UTILS
        // ================================================================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('open');
        }
    </script>

</body>

</html>
